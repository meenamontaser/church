<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامج متابعة الأسر - كنيسة الأنبا شنودة</title>
<meta name="theme-color" content="#1A1208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="متابعة الأسر">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:#1A1208; color:#F5EDD6; direction:rtl; min-height:100vh; }
input,select,textarea { font-family:'Segoe UI',Tahoma,sans-serif; direction:rtl; }
.search-input { width:100%; background:#1F1505; border:1px solid #B8962E; border-radius:8px; padding:9px 14px; color:#F5EDD6; font-size:14px; box-sizing:border-box; }
.field-input { width:100%; background:#1F1505; border:1px solid #4A3510; border-radius:6px; padding:7px 10px; color:#F5EDD6; font-size:13px; box-sizing:border-box; }
select.field-input option { background:#1F1505; }
@media (max-width:700px){ .field-input, .search-input { font-size:16px !important; } }
#famModal .field-input, #childEditorForm .field-input, #childModal .field-input { font-size:11.5px !important; padding:6px 5px !important; letter-spacing:-0.2px; }
@media (max-width:700px){ #famModal .field-input, #childEditorForm .field-input, #childModal .field-input { font-size:12px !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtSEqHUg1G81ReynWCImQurttmeyqblhM",
  authDomain: "meena-253b3.firebaseapp.com",
  projectId: "meena-253b3",
  storageBucket: "meena-253b3.firebasestorage.app",
  messagingSenderId: "612273445379",
  appId: "1:612273445379:web:33b2fcd882616feaa5cc36"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DATA_DOC = doc(db, "church", "families");

const initialData = { areas: [] };

let state = { data: null, path: [], modal: null, viewFamily: null, localSearch: "", globalSearch: "", globalResults: [], syncing: false, lastSync: null };

// ===== حماية البيانات =====
const GOOD_KEY1="church_good_1", GOOD_KEY2="church_good_2";
const ls = { get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } } };
const areasOf = d => (d&&Array.isArray(d.areas))?d.areas.length:0;
const famTotal = d => ((d&&d.areas)||[]).reduce((t,a)=>t+areaFamCount(a),0);
// يمنع كتابة بيانات فاضية فوق بيانات موجودة
function wouldWipe(newData, ref){
  if(!newData||!Array.isArray(newData.areas)) return true;
  return newData.areas.length===0 && !!ref && (areasOf(ref)>1 || famTotal(ref)>0);
}
function readGood(k){ try{ const o=JSON.parse(ls.get(k)); return (o&&o.data)?o:null; }catch(e){ return null; } }
function rememberGood(data){
  if(areasOf(data)===0) return;
  const cur=ls.get(GOOD_KEY1);
  try{ const c=cur&&JSON.parse(cur); if(c&&Date.now()-c.t>6*3600*1000) ls.set(GOOD_KEY2,cur); }catch(e){}
  ls.set(GOOD_KEY1,JSON.stringify({t:Date.now(),data}));
}

onSnapshot(DATA_DOC, { includeMetadataChanges: true }, (snap) => {
  const fromCache = !!(snap.metadata && snap.metadata.fromCache);
  const prevOffline = state.offline;
  state.offline = fromCache;
  let changed = prevOffline !== fromCache;
  if (snap.exists()) {
    const raw = (snap.data() || {}).data;
    if (!raw || !Array.isArray(raw.areas)) {
      state.loadError = "شكل البيانات على السيرفر غير متوقع. لم يتم تغيير أي شيء.";
      changed = true;
    } else {
      const fixed = normalizeCodes(raw);
      const sig = JSON.stringify(fixed);
      if (sig !== state._sig) { state._sig = sig; state.data = fixed; changed = true; }
      state.loadError = null; state.missing = false;
      if (!fromCache) {
        state.lastServer = fixed;
        if (state._goodSig !== sig) { state._goodSig = sig; rememberGood(fixed); }
        if (JSON.stringify(raw) !== sig) save(fixed);
      }
    }
  } else if (!fromCache) {
    // السيرفر أكد إن مفيش بيانات: ما نكتبش أي حاجة تلقائياً
    if (!state.data) { state.missing = true; changed = true; }
  }
  // لو الاتصال لسه من الكاش وفاضي: نستنى السيرفر، ومنكتبش حاجة
  state.lastSync = new Date();
  if (!changed) { renderSyncBar(); return; }
  if (isTyping() || state.modal) { state.pendingRender = true; renderSyncBar(); }
  else render();
}, (err) => {
  state.loadError = "تعذر الاتصال بالسيرفر: " + ((err && err.message) || err);
  if (!state.data) render();
});

function isTyping() {
  const a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
document.addEventListener("focusout", () => setTimeout(() => {
  if (state.pendingRender && !state.modal && !isTyping()) render();
}, 300));

async function save(newData) {
  if (wouldWipe(newData, state.lastServer || state.data)) { console.warn("blocked empty write"); return; }
  state.syncing = true; state.saveError = false; renderSyncBar();
  try { await setDoc(DATA_DOC, { data: newData }); }
  catch (e) { state.syncing = false; state.saveError = true; renderSyncBar(); return; }
  state.syncing = false; state.lastSync = new Date(); renderSyncBar();
}

function syncText() {
  return state.offline ? "⚠️ الاتصال بالسيرفر غير مؤكد — الحفظ متوقف مؤقتاً"
    : state.saveError ? "⚠️ فشل الحفظ — حاول تاني"
    : state.syncing ? "⏳ جاري الحفظ..."
    : `✅ محفوظ ومتزامن · ${state.lastSync?.toLocaleTimeString("ar-EG")||""}`;
}
function syncColor() { return (state.offline||state.saveError||state.syncing) ? "#F0A500" : "#4CAF50"; }

function renderSyncBar() {
  const bar = document.getElementById("syncbar");
  if (bar) { bar.innerHTML = syncText(); bar.style.color = syncColor(); }
}

function updateData(fn) {
  if (state.offline) { alert("الاتصال بالسيرفر غير مؤكد دلوقتي، فتم إيقاف الحفظ مؤقتاً عشان ما نكتبش فوق بيانات أحدث. استنى لحد ما يظهر ✅ محفوظ ومتزامن وجرّب تاني."); return; }
  const newData = normalizeCodes(fn(state.data));
  if (wouldWipe(newData, state.data)) { alert("تم منع الحفظ: العملية دي هتخلي كل البيانات فاضية."); return; }
  state.data = newData;
  save(newData);
  render();
}

// ترقيم متصل لأكواد الأسر داخل كل منطقة (عبر كل الشوارع والمنازل بالترتيب)
const recodeAreaContinuous = a => { let n = 0; return {...a, streets:(a.streets||[]).map(s=>({...s, buildings:(s.buildings||[]).map(b=>({...b, families:(b.families||[]).map(f=>({...f, code:a.code+(++n)}))}))}))}; };
const normalizeCodes = d => ({...d, areas:(d.areas||[]).map(recodeAreaContinuous)});

// أعداد
const famMembers = f => (f.husbandName?1:0)+(f.wifeName?1:0)+(f.children||[]).length;
const areaFamCount = a => (a.streets||[]).reduce((t,s)=>t+(s.buildings||[]).reduce((u,b)=>u+(b.families||[]).length,0),0);

// ===== البحث في كل البيانات =====
const normAr = t => String(t==null?"":t).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim();
const _SKIP_KEYS = ["id","children","streets","buildings","families"];
const allVals = o => Object.keys(o||{}).filter(k=>!_SKIP_KEYS.includes(k)).map(k=>o[k]);
const _fpCache = new WeakMap();
function famParts(f){
  let p=_fpCache.get(f);
  if(!p){
    const hk=[],wk=[],fk=[];
    Object.keys(f).forEach(k=>{
      if(_SKIP_KEYS.includes(k)) return;
      if(k.startsWith("husband")||k==="churchService") hk.push(f[k]);
      else if(k.startsWith("wife")) wk.push(f[k]);
      else fk.push(f[k]);
    });
    const j=a=>normAr(a.map(v=>v==null?"":v).join(" | "));
    p={h:j(hk),w:j(wk),f:j(fk),kids:(f.children||[]).map(c=>({c,t:j(allVals(c))}))};
    _fpCache.set(f,p);
  }
  return p;
}
const famMatches = (f,q) => { const p=famParts(f); return p.h.includes(q)||p.w.includes(q)||p.f.includes(q)||p.kids.some(k=>k.t.includes(q)); };
const kidHit = (fam,q) => { if(!q) return ""; const k=famParts(fam).kids.find(k=>k.t.includes(q)); return k?`<div style="font-size:11px;color:#D4AF5A;margin-top:3px">👶 ${escHtml(k.c.name||"")}</div>`:""; };
function searchAll(areas,q){
  const out=[];
  areas.forEach(area=>{
    if(normAr(area.name).includes(q)) out.push({kind:"area",type:"area",label:area.name,area});
    area.streets.forEach(street=>{
      if(normAr(street.name).includes(q)) out.push({kind:"street",type:"street",label:street.name,area,street});
      street.buildings.forEach(building=>{
        if(normAr(building.name).includes(q)) out.push({kind:"building",type:"building",label:building.name,area,street,building});
        building.families.forEach(fam=>{
          const p=famParts(fam);
          const base={kind:"person",area,street,building,fam};
          if(p.h.includes(q)) out.push({...base,type:"husband",label:fam.husbandName||"(بدون اسم)"});
          if(p.w.includes(q)) out.push({...base,type:"wife",label:fam.wifeName||"(بدون اسم)"});
          if(p.f.includes(q)) out.push({...base,type:"family",label:"أسرة "+(fam.husbandName||"")});
          p.kids.forEach(k=>{ if(k.t.includes(q)) out.push({...base,type:"child",label:k.c.name||"(بدون اسم)"}); });
        });
      });
    });
  });
  return out;
}
const RES_TYPES={husband:["زوج","#2C4A1A"],wife:["زوجة","#1A2C4A"],family:["الأسرة","#4A2C1A"],child:["ابن/بنت","#3A2810"],area:["منطقة","#3A1A4A"],street:["شارع","#1A4A4A"],building:["منزل","#4A4A1A"]};
function resultCardHTML(r,click,withArea){
  const [lbl,bg]=RES_TYPES[r.type];
  const loc=[];
  if(withArea&&r.kind!=="area") loc.push(r.area.name);
  if(r.street&&r.kind!=="street") loc.push(r.street.name);
  if(r.building&&r.kind!=="building") loc.push(r.building.name);
  return `<div style="${C.famCard};cursor:pointer;padding:10px" onclick="${click}">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
      <span style="background:${bg};color:#D4AF5A;border-radius:4px;padding:2px 7px;font-size:10px">${lbl}</span>
      <span style="font-size:14px;font-weight:bold">${escHtml(r.label)}</span>
      ${r.fam?`<span style="font-size:11px;color:#B8962E">كود: ${r.fam.code}</span>`:""}
    </div>
    ${loc.length?`<div style="font-size:11px;color:#A89060">📍 ${loc.map(x=>escHtml(x)).join(" › ")}</div>`:""}
  </div>`;
}
const resultClick = r => r.kind==="person"
  ? `_openFamilyGlobal(${r.area.id},${r.street.id},${r.building.id},${r.fam.id})`
  : `_jumpTo(${r.area.id}${r.street?","+r.street.id:""}${r.building?","+r.building.id:""})`;
function globalResultsHTML(){
  if(!state.globalSearch) return "";
  if(normAr(state.globalSearch).length<2) return '<div style="margin-top:8px;color:#A89060;font-size:12px">اكتب حرفين على الأقل</div>';
  if(state.globalResults.length===0) return '<div style="margin-top:8px;color:#A89060;font-size:12px">لا توجد نتائج</div>';
  return `<div style="margin-top:10px;max-height:300px;overflow-y:auto">
    <div style="color:#B8962E;font-size:12px;margin-bottom:8px">نتائج البحث (${state.globalTotal})${state.globalTotal>state.globalResults.length?` — عرض أول ${state.globalResults.length}`:""}</div>
    ${state.globalResults.map((r,i)=>resultCardHTML(r,`_openGlobalResult(${i})`,true)).join("")}
  </div>`;
}

// إدراج عنصر في مكان محدد: end | start | after:<id>
const insertAt = (arr,item,pos) => {
  if(!pos||pos==="end") return [...arr,item];
  if(pos==="start") return [item,...arr];
  const i=arr.findIndex(x=>String(x.id)===String(pos).slice(6));
  return i<0?[...arr,item]:[...arr.slice(0,i+1),item,...arr.slice(i+1)];
};
function posSelectHTML(items,selId,selected,onchange){
  return `<div style="margin-bottom:12px"><div style="font-size:11px;color:#A89060;margin-bottom:4px">مكان الإضافة</div>
    <select class="field-input" id="${selId}"${onchange?` onchange="${onchange}"`:""}>
      <option value="end">في الآخر</option>
      <option value="start"${selected==="start"?" selected":""}>في الأول</option>
      ${items.map(it=>`<option value="after:${it.id}"${selected==="after:"+it.id?" selected":""}>بعد: ${escHtml(it.label)}</option>`).join("")}
    </select></div>`;
}
// ===== نسخ احتياطي واسترجاع =====
const stamp = () => { const d=new Date(), p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes()); };
function _downloadJSON(name,obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} },4000);
}
window._downloadBackup = which => {
  let data, label="";
  if(which==="current") data=state.data;
  else { const g=readGood(which==="good1"?GOOD_KEY1:GOOD_KEY2); data=g&&g.data; label="-device"; }
  if(!data){ alert("مفيش بيانات للتنزيل."); return; }
  _downloadJSON("backup"+label+"-"+stamp()+".json",{data});
};
window._restoreFromFile = input => {
  const file=input.files&&input.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let obj; try{ obj=JSON.parse(rd.result); }catch(e){ alert("الملف مش صالح."); input.value=""; return; }
    const data=(obj&&obj.data&&Array.isArray(obj.data.areas))?obj.data:(obj&&Array.isArray(obj.areas)?obj:null);
    if(!data||data.areas.length===0||!data.areas.every(a=>a&&Array.isArray(a.streets))){ alert("الملف مش نسخة احتياطية صحيحة أو فاضي."); input.value=""; return; }
    const have=state.data&&famTotal(state.data)>0;
    if(!confirm("الملف فيه "+data.areas.length+" منطقة و"+famTotal(data)+" أسرة."+(have?" هيستبدل البيانات الحالية ("+famTotal(state.data)+" أسرة)، وهتتنزل لك نسخة منها الأول.":"")+" متابع؟")){ input.value=""; return; }
    if(state.data&&areasOf(state.data)>0) _downloadJSON("before-restore-"+stamp()+".json",{data:state.data});
    state.missing=false; state.loadError=null;
    updateData(()=>data);
    if(state.modal) _setModal(null);
  };
  rd.readAsText(file);
};
window._createEmptyDB = async () => {
  if(!state.missing) return;
  if(!confirm("هيتم إنشاء قاعدة بيانات جديدة فاضية. متأكد إنه مفيش بيانات قديمة ممكن تتسترجع؟")) return;
  state.missing=false; state.data={areas:[]}; state._sig=JSON.stringify(state.data); state.lastServer=null;
  render(); await save(state.data);
};
function backupModalHTML(){
  const g1=readGood(GOOD_KEY1), g2=readGood(GOOD_KEY2);
  const fmt=t=>new Date(t).toLocaleString("ar-EG");
  const cnt=d=>areasOf(d)+" منطقة · "+famTotal(d)+" أسرة";
  const btn=(w,t)=>`<button style="${C.btnOutline};display:block;width:100%;margin-bottom:8px;text-align:right" onclick="_downloadBackup('${w}')">${t}</button>`;
  return `<div style="${C.modal}" onclick="if(event.target===this)_setModal(null)"><div style="${C.modalBox}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="color:#B8962E;font-size:15px;font-weight:bold">💾 النسخ الاحتياطية</span>
      <button onclick="_setModal(null)" style="background:none;border:none;color:#A89060;font-size:18px;cursor:pointer">✕</button>
    </div>
    ${btn("current","⬇️ تنزيل نسخة من البيانات الحالية ("+cnt(state.data)+")")}
    ${g1?btn("good1","⬇️ آخر نسخة سليمة محفوظة على الجهاز ("+fmt(g1.t)+" — "+cnt(g1.data)+")"):""}
    ${g2?btn("good2","⬇️ نسخة أقدم على الجهاز ("+fmt(g2.t)+" — "+cnt(g2.data)+")"):""}
    <div style="border-top:1px solid #4A3510;margin:12px 0"></div>
    <div style="font-size:12px;color:#A89060;margin-bottom:6px">📂 استرجاع من ملف نسخة احتياطية (بيستبدل البيانات الحالية، وبتتنزل نسخة منها الأول تلقائياً)</div>
    <input type="file" id="restoreFile" accept=".json,application/json" onchange="_restoreFromFile(this)" style="color:#F0E6D0;font-size:12px;max-width:100%">
  </div></div>`;
}
function missingScreenHTML(){
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center">
    <div style="font-size:30px;color:#B8962E">✞</div>
    <div style="color:#B8962E;font-size:16px">لم يتم العثور على بيانات على السيرفر</div>
    <div style="color:#A89060;font-size:12px;line-height:1.9;max-width:420px">لو كان فيه بيانات قبل كده، استرجعها من ملف نسخة احتياطية. ما تضغطش "إنشاء قاعدة جديدة" إلا لو متأكد إنها أول مرة.</div>
    <button style="${C.btn}" onclick="document.getElementById('restoreFile').click()">📂 استرجاع من ملف نسخة احتياطية</button>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="_restoreFromFile(this)">
    <button style="${C.btnOutline}" onclick="_createEmptyDB()">إنشاء قاعدة بيانات جديدة فارغة</button>
  </div>`;
}
function errorScreenHTML(){
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center">
    <div style="font-size:30px;color:#B8962E">✞</div>
    <div style="color:#F0A500;font-size:14px;line-height:1.9;max-width:420px">${escHtml(state.loadError||"")}</div>
    <div style="color:#A89060;font-size:12px">لم يتم تغيير أي بيانات.</div>
    <button style="${C.btn}" onclick="location.reload()">إعادة المحاولة</button>
  </div>`;
}

const recodeFamilies = (families, areaCode) => families.map((f,i) => ({...f, code: areaCode+i+1}));
const nextAreaCode = () => state.data.areas.length===0 ? 1000 : Math.max(...state.data.areas.map(a=>a.code))+1000;

// CRUD
window._addArea = (n,pos) => {
  if(!pos||pos==="end"){ updateData(d => ({...d, areas:[...d.areas,{id:Date.now(),code:nextAreaCode(),name:n,streets:[]}]})); return; }
  if(!confirm("إضافة منطقة في النص هتغيّر كود المناطق اللي بعدها وأكواد أسرها. متأكد؟")) return;
  updateData(d => ({...d, areas:insertAt(d.areas,{id:Date.now(),code:0,name:n,streets:[]},pos).map((a,i)=>({...a,code:(i+1)*1000}))}));
};
window._editArea = (id,n) => updateData(d => ({...d, areas:d.areas.map(a=>a.id===id?{...a,name:n}:a)}));
window._deleteArea = id => { if(!confirm("حذف المنطقة؟"))return; updateData(d=>{const f=d.areas.filter(a=>a.id!==id);return{...d,areas:f.map((a,i)=>({...a,code:(i+1)*1000}))}}); state.path=[]; render(); };

window._addStreet = (aId,n,pos) => updateData(d=>({...d,areas:d.areas.map(a=>a.id===aId?{...a,streets:insertAt(a.streets,{id:Date.now(),name:n,buildings:[]},pos)}:a)}));
window._editStreet = (aId,sId,n) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id===sId?{...s,name:n}:s)})}));
window._deleteStreet = (aId,sId) => { if(!confirm("حذف الشارع؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.filter(s=>s.id!==sId)})})); state.path=state.path.slice(0,1); render(); };

window._addBuilding = (aId,sId,n,pos) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:insertAt(s.buildings,{id:Date.now(),name:n,families:[]},pos)})})}));
window._editBuilding = (aId,sId,bId,n) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,name:n})})})}));
window._deleteBuilding = (aId,sId,bId) => { if(!confirm("حذف المنزل؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.filter(b=>b.id!==bId)})})})); state.path=state.path.slice(0,2); render(); };

window._addFamily = (aId,sId,bId,fam,children=[],pos) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:recodeFamilies(insertAt(b.families,{...fam,id:Date.now(),children:children},pos),a.code)})})})}));
window._editFamily = (aId,sId,bId,fId,fam,children) => { updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,...fam,children:children!==undefined?children:f.children})})})})})); if(state.viewFamily) state.viewFamily={...state.viewFamily,fam:{...state.viewFamily.fam,...fam,children:children!==undefined?children:state.viewFamily.fam.children}}; };
window._deleteFamily = (aId,sId,bId,fId) => { if(!confirm("حذف الأسرة؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:recodeFamilies(b.families.filter(f=>f.id!==fId),a.code)})})})})); state.viewFamily=null; render(); };

// تنقل بين تاب بيانات الأسرة وتاب الأبناء جوه فورم إضافة/تعديل الأسرة (قبل الحفظ النهائي)
window._famSwitchTab = (tab) => {
  const m = state.modal;
  if(!m) return;
  if(m.activeTab==="family") m.famData = {...m.famData, ...getFormData('famModal')};
  m.activeTab = tab;
  render();
};
window._famOpenChildEditor = (childId) => {
  const m = state.modal;
  if(!m) return;
  m.childEditor = childId==null ? {id:null,data:{}} : {id:childId,data:{...m.children.find(c=>c.id===childId)}};
  render();
};
window._famCancelChildEditor = () => { const m=state.modal; if(!m)return; m.childEditor=null; render(); };
window._famSaveChildEditor = () => {
  const m = state.modal;
  if(!m) return;
  const data = getFormData('childEditorForm');
  if(m.childEditor.id==null){
    const newId = Date.now()+Math.floor(Math.random()*1000)+m.children.length;
    m.children = [...m.children, {...data, id:newId, _unsure:[...(m.childEditor.data._unsure||[])]}];
  } else {
    m.children = m.children.map(c=>c.id===m.childEditor.id?{...c,...data,_unsure:[...(m.childEditor.data._unsure||[])]}:c);
  }
  m.childEditor = null;
  render();
};
window._famDeleteLocalChild = (childId) => {
  const m = state.modal;
  if(!m) return;
  if(!confirm("حذف الابن؟")) return;
  m.children = m.children.filter(c=>c.id!==childId);
  render();
};
window._famSetPos = v => { if(state.modal) state.modal.insertPos=v; };
window._famFinalSave = (mode,aId,sId,bId,fId) => {
  const m = state.modal;
  if(!m) return;
  if(m.activeTab==="family") m.famData = {...m.famData, ...getFormData('famModal')};
  if(m.ocr){
    const w=draftWarnings(m);
    if(w.length && !confirm("ملاحظات على البيانات:\n- "+w.join("\n- ")+"\n\nتحفظ برضه؟")) return;
    if(mode==="add"){
      const dup=findSimilar(m.famData);
      if(dup && !confirm("⚠️ فيه أسرة مشابهة موجودة:\n"+dup+"\n\nموافق = إضافة كأسرة جديدة\nإلغاء = رجوع للمراجعة")) return;
    }
  }
  const kids=m.children.map(c=>{ const {_unsure,...r}=c; return r; });
  if(mode==="add") window._addFamily(aId,sId,bId,m.famData,kids,m.insertPos);
  else window._editFamily(aId,sId,bId,fId,m.famData,kids);
  _setModal(null);
};

window._moveFamily = (fromA,fromS,fromB,fId,toA,toS,toB) => {
  updateData(d=>{
    let moved=null;
    let areas=d.areas.map(a=>{if(a.id!==fromA)return a;return{...a,streets:a.streets.map(s=>{if(s.id!==fromS)return s;return{...s,buildings:s.buildings.map(b=>{if(b.id!==fromB)return b;moved=b.families.find(f=>f.id===fId);return{...b,families:recodeFamilies(b.families.filter(f=>f.id!==fId),a.code)};})};})};});
    if(!moved)return d;
    areas=areas.map(a=>{if(a.id!==toA)return a;return{...a,streets:a.streets.map(s=>{if(s.id!==toS)return s;return{...s,buildings:s.buildings.map(b=>{if(b.id!==toB)return b;return{...b,families:recodeFamilies([...b.families,{...moved}],a.code)};})};})};});
    return{...d,areas};
  });
  state.viewFamily=null; state.modal=null; render();
};

window._addChild = (aId,sId,bId,fId,child) => { updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,children:[...(f.children||[]),{...child,id:Date.now()}]})})})})})); _refreshViewFamily(aId,sId,bId,fId); };
window._editChild = (aId,sId,bId,fId,cId,child) => { updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,children:f.children.map(c=>c.id!==cId?c:{...c,...child})})})})})})); _refreshViewFamily(aId,sId,bId,fId); };
window._deleteChild = (aId,sId,bId,fId,cId) => { if(!confirm("حذف الابن؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,children:f.children.filter(c=>c.id!==cId)})})})})})); _refreshViewFamily(aId,sId,bId,fId); };

function _refreshViewFamily(aId,sId,bId,fId) {
  if(!state.viewFamily)return;
  const area=state.data.areas.find(a=>a.id===aId);
  const fam=area?.streets.find(s=>s.id===sId)?.buildings.find(b=>b.id===bId)?.families.find(f=>f.id===fId);
  if(fam) state.viewFamily={...state.viewFamily,fam};
}

window._goHome = () => { state.path=[]; state.localSearch=""; render(); };

let _gT=null, _sT=null;
window._doGlobalSearch = (q) => {
  state.globalSearch = q;
  const c=document.getElementById("gclear"); if(c) c.style.display=q?"inline-block":"none";
  clearTimeout(_gT);
  _gT=setTimeout(()=>{
    const n=normAr(q);
    const all=n.length>=2?searchAll(state.data.areas,n):[];
    state.globalTotal=all.length; state.globalResults=all.slice(0,100);
    const box=document.getElementById("gResults"); if(box) box.innerHTML=globalResultsHTML();
  },120);
};
window._clearGlobal = () => {
  clearTimeout(_gT);
  state.globalSearch=""; state.globalResults=[]; state.globalTotal=0;
  const i=document.getElementById("gsrch"); if(i) i.value="";
  const box=document.getElementById("gResults"); if(box) box.innerHTML="";
  const c=document.getElementById("gclear"); if(c) c.style.display="none";
};
window._jumpTo = (aId,sId,bId) => {
  state.path=[{type:"area",id:aId}];
  if(sId) state.path.push({type:"street",id:sId});
  if(bId) state.path.push({type:"building",id:bId});
  state.localSearch=""; render();
};
window._goTo = (type,id) => { state.path=[...state.path,{type,id}]; state.localSearch=""; render(); };
window._goBack = () => { state.path=state.path.slice(0,-1); state.localSearch=""; render(); };
window._setModal = m => { state.modal=m; render(); };
window._setViewFamily = vf => { state.viewFamily=vf; render(); };
window._setSearch = v => {
  state.localSearch=v;
  const c=document.getElementById("srchClear"); if(c) c.style.display=v?"inline-block":"none";
  clearTimeout(_sT); _sT=setTimeout(_renderResults,120);
};
window._clearSearch = () => { const i=document.getElementById("srch"); if(i) i.value=""; _setSearch(""); };

window._openGlobalResult = (i) => {
  const r = state.globalResults[i];
  if(!r) return;
  state.globalSearch = ""; state.globalResults = []; state.globalTotal = 0;
  state.path = [{type:"area",id:r.area.id}];
  if(r.street) state.path.push({type:"street",id:r.street.id});
  if(r.building) state.path.push({type:"building",id:r.building.id});
  state.localSearch = "";
  state.viewFamily = r.fam ? {fam:r.fam, areaId:r.area.id, streetId:r.street.id, buildingId:r.building.id} : null;
  render();
};

window._openFamilyGlobal = (aId,sId,bId,fId) => {
  const area=state.data.areas.find(a=>a.id===aId);
  const street=area?.streets.find(s=>s.id===sId);
  const building=street?.buildings.find(b=>b.id===bId);
  const fam=building?.families.find(f=>f.id===fId);
  if(fam){state.viewFamily={fam,areaId:aId,streetId:sId,buildingId:bId};render();}

window._openFamily = (aId,sId,bId,fId) => {
  const area=state.data.areas.find(a=>a.id===aId);
  const street=area?.streets.find(s=>s.id===sId);
  const building=street?.buildings.find(b=>b.id===bId);
  const fam=building?.families.find(f=>f.id===fId);

};

function getFormData(modalId){
  const data={};
  document.querySelectorAll(`#${modalId} [data-key]`).forEach(el=>{data[el.dataset.key]=el.value;});

}

window._mvUpdateStreets = () => {
  const aId=parseInt(document.getElementById("mv_a").value);
  const area=state.data.areas.find(a=>a.id===aId);
  const ss=document.getElementById("mv_s");
  const bb=document.getElementById("mv_b");
  ss.innerHTML=`<option value="">الشارع</option>${(area?.streets||[]).map(s=>`<option value="${s.id}">${escHtml(s.name)}</option>`).join("")}`;
  bb.innerHTML=`<option value="">المنزل</option>`;
  ss.onchange=()=>{
    const sId=parseInt(ss.value);
    const street=area?.streets.find(s=>s.id===sId);
    bb.innerHTML=`<option value="">المنزل</option>${(street?.buildings||[]).map(b=>`<option value="${b.id}">${escHtml(b.name)}</option>`).join("")}`;
  };
};

window._doMove = (fromA,fromS,fromB,fId) => {
  const toA=parseInt(document.getElementById("mv_a")?.value);
  const toS=parseInt(document.getElementById("mv_s")?.value);
  const toB=parseInt(document.getElementById("mv_b")?.value);
  if(!toA||!toS||!toB){alert("اختر المنطقة والشارع والمنزل");return;}
  _moveFamily(fromA,fromS,fromB,fId,toA,toS,toB);
};

window.getFormData = (modalId) => {
  const data={};
  document.querySelectorAll(`#${modalId} [data-key]`).forEach(el=>{data[el.dataset.key]=el.value;});
  return data;
};

function _renderResults(){
  const box=document.getElementById("srchResults");
  if(!box||!state.data){ _renderContent(); return; }
  const tmp=document.createElement("div");
  tmp.innerHTML=getPageHTML();
  const nb=tmp.querySelector("#srchResults");
  if(nb) box.innerHTML=nb.innerHTML; else _renderContent();
}

function _renderContent(){
  const el = document.getElementById("pageContent");
  if(!el||!state.data) return;
  el.innerHTML = getPageHTML();
}

function getPageHTML(){
  const path=state.path;
  const area=path[0]?state.data.areas.find(a=>a.id===path[0].id):null;
  const street=path[1]?area?.streets.find(s=>s.id===path[1].id):null;
  const building=path[2]?street?.buildings.find(b=>b.id===path[2].id):null;

  if(path.length===0) return renderHome();
  if(path.length===1&&area) return renderArea(area);
  if(path.length===2&&area&&street) return renderStreet(area,street);
  if(path.length===3&&area&&street&&building) return renderBuilding(area,street,building);
  return "";
}

// عنوان خدمة قراءة الكارت (وضع حقيقي). فاضي = الخدمة لسه مش متوصلة
const OCR_ENDPOINT="https://church-ocr.meenamontaser2018.workers.dev";
const DEMO_OK=false; // true في النسخة التجريبية فقط: بيانات كارت جاهزة بدون نت
const toEn = t => String(t==null?"":t).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
// بيانات كارت حقيقي اتقرى مسبقاً — بتتستخدم في الوضع التجريبي بس (بدون نت)
const DEMO_CARD = {

           wifeName:"", wifePhone:"01220185425", wifeBirthdate:"4/2/1988", wifeFather:"أبونا كيرياكوس", wifeQualification:"بكالوريوس تجارة", wifeWork:"محل ملابس" },

function _resizeToDataUrl(file,max=1600){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file);
  img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.85)); };
  img.onerror=()=>rej(new Error("الصورة مش مقروءة")); img.src=u; }); }
// الوضع الحقيقي: الصور تتبعت لخدمة وسيطة (فيها مفتاح الـAPI) وترجع JSON بالشكل {family,unsure,children:[{data,unsure}]}
async function _ocrExtract(dataUrls,kind){
  if(!OCR_ENDPOINT){ if(!DEMO_OK) throw new Error("خدمة قراءة الكارت لسه مش متوصلة"); await new Promise(r=>setTimeout(r,900)); return DEMO_CARD; }
  const r=await fetch(OCR_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({images:dataUrls,kind})});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
}

window._ocrFiles=async(inp)=>{
  const m=state.modal; const files=[...(inp.files||[])]; if(!m||!files.length) return;
  if(m.activeTab==="family") m.famData={...m.famData,...getFormData('famModal')};

  try{
    const urls=await Promise.all(files.map(f=>_resizeToDataUrl(f)));
    const kind=(m.activeTab==="children")?"children":"family";
    const res=await _ocrExtract(urls,kind);
    if(state.modal!==m) return;
    if(kind==="family"){
      const f=res.family||{};
      Object.keys(f).forEach(k=>{ if(f[k]!=="" && f[k]!=null) m.famData[k]=String(f[k]); });
      m.uncertain=new Set([...(m.uncertain||[]),...(res.unsure||[])]);
    } else {
      let added=0;
      (res.children||[]).forEach((c,i)=>{ const d=c.data||{};
        if(m.children.some(x=>(x.name||"")===(d.name||"") && (x.birthdate||"")===(d.birthdate||""))) return;
        m.children=[...m.children,{...d,id:Date.now()+Math.floor(Math.random()*100000)+i,_unsure:[...(c.unsure||[])]}]; added++; });
      if(!added) alert("مفيش أبناء جداد اتضافوا (يا الصورة مفيهاش أبناء يا هما مضافين قبل كده).");
    }
    m.ocr=true; m.ocrThumbs=[...(m.ocrThumbs||[]),...files.map(f=>URL.createObjectURL(f))];
  }catch(e){ alert("تعذرت قراءة الكارت: "+(e&&e.message||e)); }
  if(state.modal===m){ m.ocrBusy=false; render(); }
};
window._ocrChild=async(inp)=>{
  const m=state.modal; const files=[...(inp.files||[])]; if(!m||!m.childEditor||!files.length) return;

  try{
    const urls=await Promise.all(files.map(f=>_resizeToDataUrl(f)));
    const res=await _ocrExtract(urls,"children");
    if(state.modal===m && m.childEditor){
      const kids=res.children||[];
      if(!kids.length) throw new Error("مفيش بيانات أبناء في الصورة");

      kids.forEach((k,i)=>{ const d=k.data||{};

        m.children=[...m.children,{...d,id:Date.now()+Math.floor(Math.random()*100000)+i,_unsure:[...(k.unsure||[])]}]; added++; });
      m.ocr=true; m.ocrThumbs=[...(m.ocrThumbs||[]),...files.map(f=>URL.createObjectURL(f))];
      if(!hasInput) m.childEditor=null;
      if(!added) alert("مفيش أبناء جداد اتضافوا (الصورة مفيهاش أبناء، أو هما مضافين قبل كده).");
    }
  }catch(e){ alert("تعذرت قراءة الصورة: "+(e&&e.message||e)); }

function _parseD(v){ const x=toEn(v).trim().match(/^(\d{1,2})\D+(\d{1,2})\D+(\d{2,4})$/); if(!x) return null;
  let d=+x[1],mo=+x[2],y=+x[3]; const cy=new Date().getFullYear(); if(y<100) y=(y<=(cy%100))?2000+y:1900+y;
  if(d<1||d>31||mo<1||mo>12||y<1900||y>cy) return null; return {d,mo,y}; }
function draftWarnings(m){
  const f=m.famData||{}, w=[], cy=new Date().getFullYear();
  if(!f.husbandName&&!f.wifeName) w.push("اسم الزوج والزوجة فاضيين");
  [["husbandPhone","محمول الزوج"],["wifePhone","محمول الزوجة"]].forEach(([k,l])=>{ if(f[k]){ const d=toEn(f[k]).replace(/\D/g,""); if(!/^01\d{9}$/.test(d)) w.push(l+": لازم 11 رقم ويبدأ بـ 01"); }});
  [["husbandNationalId","الرقم القومي للزوج"],["wifeNationalId","الرقم القومي للزوجة"]].forEach(([k,l])=>{ if(f[k] && toEn(f[k]).replace(/\D/g,"").length!==14) w.push(l+": لازم 14 رقم"); });
  const par={};
  [["husbandBirthdate","تاريخ ميلاد الزوج"],["wifeBirthdate","تاريخ ميلاد الزوجة"]].forEach(([k,l])=>{ if(f[k]){ const p=_parseD(f[k]); if(!p) w.push(l+" غير منطقي"); else { par[k]=p; if(cy-p.y<18) w.push(l+": السن أقل من 18"); } }});
  const pY=Math.max(par.husbandBirthdate?.y||0,par.wifeBirthdate?.y||0);
  (m.children||[]).forEach(c=>{ const n=c.name||"ابن بدون اسم";
    if(c.birthdate){ const p=_parseD(c.birthdate); if(!p){ w.push(n+": تاريخ الميلاد غير منطقي"); return; }
      if(pY && p.y-pY<15) w.push(n+": فرق السن بينه وبين الوالدين غير منطقي");
      const age=cy-p.y, q=c.qualification||""; const rng=/ابتدائ/.test(q)?[5,13]:/اعدادي|إعدادي/.test(q)?[11,16]:/ثانوي/.test(q)?[14,19]:null;
      if(rng && (age<rng[0]||age>rng[1])) w.push(n+": السن (~"+age+" سنة) مش مناسب للصف المكتوب ("+q+") — راجع تاريخ الميلاد"); }
  });
  return w;
}
function findSimilar(f){
  const ph=[f.husbandPhone,f.wifePhone].map(x=>toEn(x||"").replace(/\D/g,"")).filter(x=>x.length>=10);
  const ids=[f.husbandNationalId,f.wifeNationalId].map(x=>toEn(x||"").replace(/\D/g,"")).filter(x=>x.length===14);
  const toks=t=>normAr(t||"").split(/\s+/).filter(Boolean);
  const same=(a,b)=>{ const x=toks(a),y=toks(b); if(x.length<2||y.length<2) return false; return x.filter(t=>y.includes(t)).length>=Math.min(3,x.length,y.length); };
  for(const a of state.data.areas) for(const s of (a.streets||[])) for(const b of (s.buildings||[])) for(const g of (b.families||[])){
    const gp=[g.husbandPhone,g.wifePhone].map(x=>toEn(x||"").replace(/\D/g,""));
    const gi=[g.husbandNationalId,g.wifeNationalId].map(x=>toEn(x||"").replace(/\D/g,""));
    let why=null;
    if(ph.some(p=>gp.includes(p))) why="نفس رقم المحمول"; else if(ids.some(p=>gi.includes(p))) why="نفس الرقم القومي";
    else if(same(f.husbandName,g.husbandName)||same(f.wifeName,g.wifeName)) why="اسم مشابه";
    if(why) return "كود "+g.code+" — "+(g.husbandName||"")+(g.wifeName?" / "+g.wifeName:"")+"\n("+a.name+" › "+s.name+" › "+b.name+") · "+why;
  }
  return null;
}
function ocrBarHTML(m){
  if(m.type!=="addFamily") return "";
  const w=m.ocr?draftWarnings(m):[];
  return `<div style="margin-bottom:10px">
    <input type="file" id="ocrFile" accept="image/*" multiple style="display:none" onchange="_ocrFiles(this)">
    ${(m.childEditor||m.activeTab==="children")?"":`<input type="file" id="ocrCam" accept="image/*" capture="environment" style="display:none" onchange="_ocrFiles(this)">${m.ocrBusy?`<div style="font-size:12px;color:#D4AF5A">⏳ جاري قراءة الكارت...</div>`:`<div style="display:flex;gap:6px"><button style="${C.btn}" onclick="_camOpen('family')">📷 كاميرا (كارت الأسرة)</button><button style="${C.btnOutline};padding:6px 12px;font-size:12px" onclick="_ocrPick(false)">🖼️ من المعرض</button></div>`}`}
    ${m.ocr?`<div style="background:#2A2008;border:1px solid #B8962E;border-radius:6px;padding:8px;margin-top:8px;font-size:11px;color:#F5EDD6;line-height:1.7">
      📝 <b>مسودة من الصورة</b> — لسه ما اتحفظتش. الحقول <span style="color:#F0C000">الصفراء</span> غير مؤكدة، راجعها من الصورة. الحقل الفاضي = مش مقروء.${(OCR_ENDPOINT||!DEMO_OK)?"":" <b>(وضع تجريبي: بيانات كارت جاهزة)</b>"}
      <div style="margin-top:6px">${(m.ocrThumbs||[]).map((u,i)=>`<img src="${u}" onclick="_ocrZoom(${i})" style="height:56px;border-radius:4px;margin-inline-end:6px;cursor:pointer;border:1px solid #4A3510">`).join("")}</div>
      ${w.length?`<div style="margin-top:6px;color:#F0A500">⚠️ ملاحظات:<ul style="margin:2px 18px 0 0;padding:0">${w.map(x=>`<li>${escHtml(x)}</li>`).join("")}</ul></div>`:""}
    </div>`:""}
  </div>`;
}
function applyOcrMarks(){
  const m=state.modal; if(!m||!m.ocr) return;
  const mark=(sel,set)=>document.querySelectorAll(sel+" [data-key]").forEach(el=>{ if(set&&set.has(el.dataset.key)){ el.style.borderColor="#F0C000"; el.style.background="#3A2E05"; } });
  if(m.activeTab==="family") mark("#famModal",m.uncertain);
  if(m.childEditor) mark("#childEditorForm",new Set(m.childEditor.data._unsure||[]));
}
document.addEventListener("input",e=>{ const el=e.target, m=state.modal; if(!m||!m.ocr||!el.dataset||!el.dataset.key) return;
  let hit=false;
  if(el.closest("#famModal")&&m.uncertain&&m.uncertain.delete(el.dataset.key)) hit=true;
  else if(el.closest("#childEditorForm")&&m.childEditor&&m.childEditor.data._unsure){ const u=m.childEditor.data._unsure, i=u.indexOf(el.dataset.key); if(i>-1){ u.splice(i,1); hit=true; } }
  if(hit){ el.style.borderColor=""; el.style.background=""; }
});

function render(){
  state.pendingRender=false;
  if(!state.data){
    document.getElementById("root").innerHTML=state.missing?missingScreenHTML():state.loadError?errorScreenHTML():`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px"><div style="font-size:30px;color:#B8962E">✞</div><div style="color:#B8962E;font-size:16px">جاري التحميل...</div></div>`;
    return;
  }
  const path=state.path;
  const area=path[0]?state.data.areas.find(a=>a.id===path[0].id):null;
  const street=path[1]?area?.streets.find(s=>s.id===path[1].id):null;
  const building=path[2]?street?.buildings.find(b=>b.id===path[2].id):null;

  document.getElementById("root").innerHTML=`
    <div style="background:linear-gradient(135deg,#0D0800,#2C1F0A);border-bottom:2px solid #B8962E;padding:14px 24px;text-align:center">
      <div style="font-size:20px;color:#B8962E;margin-bottom:4px">✞</div>
      <div style="font-size:12px;color:#A89060;margin-bottom:2px">مطرانية الأقباط الأرثوذكس بطهطا وجهينة</div>
      <div style="font-size:18px;color:#B8962E;font-weight:bold;margin-bottom:2px">برنامج متابعة الأسر</div>
      <div style="font-size:12px;color:#A89060">كنيسة الأنبا شنودة رئيس المتوحدين</div>
    </div>
    <div id="syncbar" style="background:#0D1F0D;border-bottom:1px solid #1A3A1A;padding:6px 16px;font-size:11px;text-align:center;color:${syncColor()}">
      ${syncText()}
    </div>
    <div style="background:#110D04;border-bottom:1px solid #4A3510;padding:10px 16px">
      <div style="display:flex;gap:8px">
        <input class="search-input" id="gsrch" placeholder="🔍 بحث شامل في كل البرنامج..." value="${escHtml(state.globalSearch)}" oninput="_doGlobalSearch(this.value)" onkeydown="if(event.key==='Enter')this.blur()" enterkeyhint="search" autocomplete="off" style="flex:1">
        <button style="${C.btn}" onclick="_doGlobalSearch(document.getElementById('gsrch').value)">بحث</button>
        <button id="gclear" style="background:#C0392B;color:#fff;border:none;border-radius:5px;padding:6px 10px;cursor:pointer;display:${state.globalSearch?'inline-block':'none'}" onclick="_clearGlobal()">✕</button>
        <button style="${C.btnSm}" onclick="_setModal({type:'backup'})" title="نسخة احتياطية">💾</button>
      </div>
      <div id="gResults">${globalResultsHTML()}</div>
    </div>
    ${path.length>0?`
    <div style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:#110D04;border-bottom:1px solid #4A3510">
      <button style="background:#2C1F0A;border:1px solid #4A3510;color:#D4AF5A;cursor:pointer;font-size:13px;padding:5px 14px;border-radius:6px" onclick="_goBack()">← رجوع</button>
      <button style="background:none;border:none;color:#A89060;cursor:pointer;font-size:16px" onclick="_goHome()">🏠</button>
      <span style="color:#A89060;font-size:12px">${area?escHtml(area.name):""} ${street?"› "+escHtml(street.name):""} ${building?"› "+escHtml(building.name):""}</span>
    </div>`:""}
    <div style="padding:16px;max-width:900px;margin:0 auto" id="pageContent">
      ${getPageHTML()}
    </div>
    ${renderFamilyDetail()}
    ${renderModal()}
  `;
  applyOcrMarks();
}
</script>
</body>
</html>
