<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامج متابعة الأسر - كنيسة الأنبا شنودة</title>
<meta name="theme-color" content="#1A1208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="متابعة الأسر">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:#1A1208; color:#F5EDD6; direction:rtl; min-height:100vh; }
input,select,textarea { font-family:'Segoe UI',Tahoma,sans-serif; direction:rtl; }
.search-input { width:100%; background:#1F1505; border:1px solid #B8962E; border-radius:8px; padding:9px 14px; color:#F5EDD6; font-size:14px; box-sizing:border-box; }
.field-input { width:100%; background:#1F1505; border:1px solid #4A3510; border-radius:6px; padding:7px 10px; color:#F5EDD6; font-size:13px; box-sizing:border-box; }
select.field-input option { background:#1F1505; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtSEqHUg1G81ReynWCImQurttmeyqblhM",
  authDomain: "meena-253b3.firebaseapp.com",
  projectId: "meena-253b3",
  storageBucket: "meena-253b3.firebasestorage.app",
  messagingSenderId: "612273445379",
  appId: "1:612273445379:web:33b2fcd882616feaa5cc36"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DATA_DOC = doc(db, "church", "families");

const initialData = { areas: [] };

let state = { data: null, path: [], modal: null, viewFamily: null, localSearch: "", globalSearch: "", globalResults: [], syncing: false, lastSync: null };

onSnapshot(DATA_DOC, (snap) => {
  if (snap.exists()) { state.data = snap.data().data; }
  else { setDoc(DATA_DOC, { data: initialData }); state.data = initialData; }
  state.lastSync = new Date();
  render();
});

async function save(newData) {
  state.syncing = true; renderSyncBar();
  await setDoc(DATA_DOC, { data: newData });
  state.syncing = false; state.lastSync = new Date(); renderSyncBar();
}

function renderSyncBar() {
  const bar = document.getElementById("syncbar");
  if (bar) bar.innerHTML = state.syncing ? "⏳ جاري الحفظ..." : `✅ محفوظ ومتزامن · ${state.lastSync?.toLocaleTimeString("ar-EG")||""}`;
}

function updateData(fn) {
  const newData = fn(state.data);
  state.data = newData;
  save(newData);
  render();
}

const recodeFamilies = (families, areaCode) => families.map((f,i) => ({...f, code: areaCode+i+1}));
const nextAreaCode = () => state.data.areas.length===0 ? 1000 : Math.max(...state.data.areas.map(a=>a.code))+1000;

// CRUD
window._addArea = n => updateData(d => ({...d, areas:[...d.areas,{id:Date.now(),code:nextAreaCode(),name:n,streets:[]}]}));
window._editArea = (id,n) => updateData(d => ({...d, areas:d.areas.map(a=>a.id===id?{...a,name:n}:a)}));
window._deleteArea = id => { if(!confirm("حذف المنطقة؟"))return; updateData(d=>{const f=d.areas.filter(a=>a.id!==id);return{...d,areas:f.map((a,i)=>({...a,code:(i+1)*1000}))}}); state.path=[]; render(); };

window._addStreet = (aId,n) => updateData(d=>({...d,areas:d.areas.map(a=>a.id===aId?{...a,streets:[...a.streets,{id:Date.now(),name:n,buildings:[]}]}:a)}));
window._editStreet = (aId,sId,n) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id===sId?{...s,name:n}:s)})}));
window._deleteStreet = (aId,sId) => { if(!confirm("حذف الشارع؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.filter(s=>s.id!==sId)})})); state.path=state.path.slice(0,1); render(); };

window._addBuilding = (aId,sId,n) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:[...s.buildings,{id:Date.now(),name:n,families:[]}]})})}));
window._editBuilding = (aId,sId,bId,n) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,name:n})})})}));
window._deleteBuilding = (aId,sId,bId) => { if(!confirm("حذف المنزل؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.filter(b=>b.id!==bId)})})})); state.path=state.path.slice(0,2); render(); };

window._addFamily = (aId,sId,bId,fam,children=[]) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:recodeFamilies([...b.families,{...fam,id:Date.now(),children:children}],a.code)})})})}));
window._editFamily = (aId,sId,bId,fId,fam,children) => { updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,...fam,children:children!==undefined?children:f.children})})})})})); if(state.viewFamily) state.viewFamily={...state.viewFamily,fam:{...state.viewFamily.fam,...fam,children:children!==undefined?children:state.viewFamily.fam.children}}; };
window._deleteFamily = (aId,sId,bId,fId) => { if(!confirm("حذف الأسرة؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:recodeFamilies(b.families.filter(f=>f.id!==fId),a.code)})})})})); state.viewFamily=null; render(); };

// تنقل بين تاب بيانات الأسرة وتاب الأبناء جوه فورم إضافة/تعديل الأسرة (قبل الحفظ النهائي)
window._famSwitchTab = (tab) => {
  const m = state.modal;
  if(!m) return;
  if(m.activeTab==="family") m.famData = {...m.famData, ...getFormData('famModal')};
  m.activeTab = tab;
  render();
};
window._famOpenChildEditor = (childId) => {
  const m = state.modal;
  if(!m) return;
  m.childEditor = childId==null ? {id:null,data:{}} : {id:childId,data:{...m.children.find(c=>c.id===childId)}};
  render();
};
window._famCancelChildEditor = () => { const m=state.modal; if(!m)return; m.childEditor=null; render(); };
window._famSaveChildEditor = () => {
  const m = state.modal;
  if(!m) return;
  const data = getFormData('childEditorForm');
  if(m.childEditor.id==null){
    const newId = Date.now()+Math.floor(Math.random()*1000)+m.children.length;
    m.children = [...m.children, {...data, id:newId}];
  } else {
    m.children = m.children.map(c=>c.id===m.childEditor.id?{...c,...data}:c);
  }
  m.childEditor = null;
  render();
};
window._famDeleteLocalChild = (childId) => {
  const m = state.modal;
  if(!m) return;
  if(!confirm("حذف الابن؟")) return;
  m.children = m.children.filter(c=>c.id!==childId);
  render();
};
window._famFinalSave = (mode,aId,sId,bId,fId) => {
  const m = state.modal;
  if(!m) return;
  if(m.activeTab==="family") m.famData = {...m.famData, ...getFormData('famModal')};
  if(mode==="add") window._addFamily(aId,sId,bId,m.famData,m.children);
  else window._editFamily(aId,sId,bId,fId,m.famData,m.children);
  _setModal(null);
};

window._moveFamily = (fromA,fromS,fromB,fId,toA,toS,toB) => {
  updateData(d=>{
    let moved=null;
    let areas=d.areas.map(a=>{if(a.id!==fromA)return a;return{...a,streets:a.streets.map(s=>{if(s.id!==fromS)return s;return{...s,buildings:s.buildings.map(b=>{if(b.id!==fromB)return b;moved=b.families.find(f=>f.id===fId);return{...b,families:recodeFamilies(b.families.filter(f=>f.id!==fId),a.code)};})};})};});
    if(!moved)return d;
    areas=areas.map(a=>{if(a.id!==toA)return a;return{...a,streets:a.streets.map(s=>{if(s.id!==toS)return s;return{...s,buildings:s.buildings.map(b=>{if(b.id!==toB)return b;return{...b,families:recodeFamilies([...b.families,{...moved}],a.code)};})};})};});
    return{...d,areas};
  });
  state.viewFamily=null; state.modal=null; render();
};

window._addChild = (aId,sId,bId,fId,child) => { updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,children:[...(f.children||[]),{...child,id:Date.now()}]})})})})})); _refreshViewFamily(aId,sId,bId,fId); };
window._editChild = (aId,sId,bId,fId,cId,child) => { updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,children:f.children.map(c=>c.id!==cId?c:{...c,...child})})})})})})); _refreshViewFamily(aId,sId,bId,fId); };
window._deleteChild = (aId,sId,bId,fId,cId) => { if(!confirm("حذف الابن؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,children:f.children.filter(c=>c.id!==cId)})})})})})); _refreshViewFamily(aId,sId,bId,fId); };

function _refreshViewFamily(aId,sId,bId,fId) {
  if(!state.viewFamily)return;
  const area=state.data.areas.find(a=>a.id===aId);
  const fam=area?.streets.find(s=>s.id===sId)?.buildings.find(b=>b.id===bId)?.families.find(f=>f.id===fId);
  if(fam) state.viewFamily={...state.viewFamily,fam};
}

window._goHome = () => { state.path=[]; state.localSearch=""; render(); };

window._doGlobalSearch = (q) => {
  state.globalSearch = q;
  if(!q || q.length < 2){ state.globalResults=[]; render(); return; }
  const ql = q.toLowerCase();
  const results = [];
  state.data.areas.forEach(area=>{
    area.streets.forEach(street=>{
      street.buildings.forEach(building=>{
        building.families.forEach(fam=>{
          const loc = `${escHtml(area.name)} › ${escHtml(street.name)} › ${escHtml(building.name)}`;
          // Husband
          const hf=[fam.husbandName,fam.husbandPhone,fam.husbandBirthdate,fam.husbandFather,fam.husbandQualification,fam.husbandWork,fam.husbandWorkPlace,fam.husbandExtraWork,fam.husbandEmail,fam.husbandNationalId,fam.husbandSunDegree,fam.husbandDeathDate,fam.churchService,fam.baptism,String(fam.code||""),fam.notes,fam.statusZJMD];
          if(hf.some(v=>v&&v.toString().toLowerCase().includes(ql)))
            results.push({label:fam.husbandName||"(بدون اسم)",type:"زوج",loc,area,street,building,fam});
          // Wife
          const wf=[fam.wifeName,fam.wifePhone,fam.wifeBirthdate,fam.wifeFather,fam.wifeQualification,fam.wifeWork,fam.wifeWorkPlace,fam.wifeExtraWork,fam.wifeEmail,fam.wifeNationalId,fam.wifeDeathDate,fam.wifeChurchService];
          if(wf.some(v=>v&&v.toString().toLowerCase().includes(ql)))
            results.push({label:fam.wifeName||"(بدون اسم)",type:"زوجة",loc,area,street,building,fam});
          // Children
          (fam.children||[]).forEach(child=>{
            if(childAllFields(child).some(v=>v&&v.toString().toLowerCase().includes(ql)))
              results.push({label:child.name||"(بدون اسم)",type:"ابن/بنت",loc,area,street,building,fam});
          });
        });
      });
    });
  });
  state.globalResults = results.slice(0,50);
  render();
};
window._goTo = (type,id) => { state.path=[...state.path,{type,id}]; state.localSearch=""; render(); };
window._goBack = () => { state.path=state.path.slice(0,-1); state.localSearch=""; render(); };
window._setModal = m => { state.modal=m; render(); };
window._setViewFamily = vf => { state.viewFamily=vf; render(); };
window._setSearch = v => { state.localSearch=v; _renderContent(); };

window._openGlobalResult = (i) => {
  const r = state.globalResults[i];
  if(!r) return;
  state.globalSearch = "";
  state.globalResults = [];
  state.path = [{type:"area",id:r.area.id},{type:"street",id:r.street.id},{type:"building",id:r.building.id}];
  state.localSearch = "";
  state.viewFamily = {fam:r.fam, areaId:r.area.id, streetId:r.street.id, buildingId:r.building.id};
  render();
};

window._openFamilyGlobal = (aId,sId,bId,fId) => {
  const area=state.data.areas.find(a=>a.id===aId);
  const street=area?.streets.find(s=>s.id===sId);
  const building=street?.buildings.find(b=>b.id===bId);
  const fam=building?.families.find(f=>f.id===fId);
  if(fam){state.viewFamily={fam,areaId:aId,streetId:sId,buildingId:bId};render();}
};
window._openFamily = (aId,sId,bId,fId) => {
  const area=state.data.areas.find(a=>a.id===aId);
  const street=area?.streets.find(s=>s.id===sId);
  const building=street?.buildings.find(b=>b.id===bId);
  const fam=building?.families.find(f=>f.id===fId);
  if(fam){state.viewFamily={fam,areaId:aId,streetId:sId,buildingId:bId};render();}
};

// All family fields for search
function famAllFields(f) {
  return [f.husbandName,f.wifeName,f.husbandPhone,f.wifePhone,String(f.code||""),
    f.husbandBirthdate,f.wifeBirthdate,f.husbandFather,f.wifeFather,
    f.husbandQualification,f.wifeQualification,f.husbandWork,f.wifeWork,
    f.husbandWorkPlace,f.wifeWorkPlace,f.husbandExtraWork,f.wifeExtraWork,
    f.husbandExtraWorkPlace,f.wifeExtraWorkPlace,
    f.husbandEmail,f.wifeEmail,f.husbandNationalId,f.wifeNationalId,
    f.husbandSunDegree,f.churchService,f.wifeChurchService,f.baptism,
    f.engagementChurch,f.crownChurch,f.husbandDeathDate,f.wifeDeathDate,
    f.statusAD,f.statusAKH,f.statusMD,f.statusZJMD,f.notes];
}

function childAllFields(c) {
  return [c.name,c.father,c.qualification,c.work,c.workPlace,c.phone,
    c.birthdate,c.gender,c.socialStatus,c.churchService,c.sunDegree,c.deathDate,c.email,c.notes,
    c.baptism,c.nationalId];
}

function escHtml(t){return(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

const C = {
  btn:`background:#B8962E;color:#000;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:bold;font-size:12px`,
  btnSm:`background:#B8962E;color:#000;border:none;border-radius:5px;padding:3px 9px;cursor:pointer;font-size:11px;font-weight:bold`,
  btnDanger:`background:#C0392B;color:#fff;border:none;border-radius:5px;padding:3px 9px;cursor:pointer;font-size:11px`,
  btnOutline:`background:transparent;color:#B8962E;border:1px solid #B8962E;border-radius:5px;padding:3px 9px;cursor:pointer;font-size:11px`,
  card:`background:#2C1F0A;border:1px solid #4A3510;border-radius:10px;padding:12px 10px;text-align:center`,
  modal:`position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px`,
  modalBox:`background:#1E1305;border:1px solid #B8962E;border-radius:12px;padding:20px;width:100%;max-width:540px;max-height:88vh;overflow-y:auto`,
  tag:`display:inline-block;background:#3A2810;color:#D4AF5A;border-radius:4px;padding:2px 7px;font-size:11px`,
  sec:`color:#B8962E;font-size:12px;border-bottom:1px solid #4A3510;padding-bottom:5px;margin-bottom:8px;margin-top:12px`,
  famCard:`background:#2C1F0A;border:1px solid #4A3510;border-radius:10px;padding:14px;margin-bottom:10px`,
  row:`display:flex;gap:8px;margin-bottom:8px`,
  half:`flex:1`,
};

function fl(label,key,val,type="text"){
  return `<div style="${C.half}"><div style="font-size:11px;color:#A89060;margin-bottom:3px">${label}</div><input class="field-input" type="${type}" value="${escHtml(val||"")}" data-key="${key}"></div>`;
}
function flSel(label,key,val,opts){
  return `<div style="${C.half}"><div style="font-size:11px;color:#A89060;margin-bottom:3px">${label}</div><select class="field-input" data-key="${key}">${opts.map(o=>`<option ${val===o?"selected":""}>${o}</option>`).join("")}</select></div>`;
}

function getFormData(modalId){
  const data={};
  document.querySelectorAll(`#${modalId} [data-key]`).forEach(el=>{data[el.dataset.key]=el.value;});
  return data;
}

// FAMILY FORM FIELDS
function familyFormHTML(fam={}){
  return `
  <div style="${C.sec}">✦ العنوان</div>
  <div style="${C.row}">${fl("الشارع","street",fam.street)}${fl("الحارة","hara",fam.hara)}</div>
  <div style="${C.row}">${fl("العمارة","omara",fam.omara)}${fl("الدور","floor",fam.floor)}${fl("ت","phone_home",fam.phone_home)}</div>

  <div style="${C.sec}">✦ بيانات الزوج والزوجة</div>
  <div style="display:flex;gap:8px;margin-bottom:6px">
    <div style="flex:1;background:#1A0F04;border-radius:8px;padding:8px">
      <div style="color:#B8962E;font-size:12px;text-align:center;margin-bottom:8px;border-bottom:1px solid #4A3510;padding-bottom:4px">الزوج</div>
      ${fl("الاسم","husbandName",fam.husbandName)}
      ${fl("المحمول","husbandPhone",fam.husbandPhone)}

      ${fl("أب الاعتراف","husbandFather",fam.husbandFather)}
      ${fl("المؤهل","husbandQualification",fam.husbandQualification)}
      ${fl("العمل الأساسي","husbandWork",fam.husbandWork)}
      ${fl("مكان العمل","husbandWorkPlace",fam.husbandWorkPlace)}
      ${fl("العمل الإضافي","husbandExtraWork",fam.husbandExtraWork)}
      ${fl("مكان العمل الإضافي","husbandExtraWorkPlace",fam.husbandExtraWorkPlace)}
      ${fl("Email","husbandEmail",fam.husbandEmail)}
      ${fl("الرقم القومي","husbandNationalId",fam.husbandNationalId)}
      ${fl("الدرجة الشموسية","husbandSunDegree",fam.husbandSunDegree)}
      ${fl("تاريخ الوفاة","husbandDeathDate",fam.husbandDeathDate)}
      ${fl("الخدمة الكنسية","churchService",fam.churchService)}
    </div>
    <div style="flex:1;background:#1A0F04;border-radius:8px;padding:8px">
      <div style="color:#B8962E;font-size:12px;text-align:center;margin-bottom:8px;border-bottom:1px solid #4A3510;padding-bottom:4px">الزوجة</div>
      ${fl("الاسم","wifeName",fam.wifeName)}
      ${fl("المحمول","wifePhone",fam.wifePhone)}
      ${fl("تاريخ الميلاد","wifeBirthdate",fam.wifeBirthdate)}
      ${fl("أب الاعتراف","wifeFather",fam.wifeFather)}
      ${fl("المؤهل","wifeQualification",fam.wifeQualification)}
      ${fl("العمل الأساسي","wifeWork",fam.wifeWork)}
      ${fl("مكان العمل","wifeWorkPlace",fam.wifeWorkPlace)}
      ${fl("العمل الإضافي","wifeExtraWork",fam.wifeExtraWork)}
      ${fl("مكان العمل الإضافي","wifeExtraWorkPlace",fam.wifeExtraWorkPlace)}
      ${fl("Email","wifeEmail",fam.wifeEmail)}
      ${fl("الرقم القومي","wifeNationalId",fam.wifeNationalId)}
      ${fl("تاريخ الوفاة","wifeDeathDate",fam.wifeDeathDate)}
      ${fl("الخدمة الكنسية","wifeChurchService",fam.wifeChurchService)}
    </div>
  </div>

  <div style="${C.sec}">✦ بيانات كنسية</div>
  <div style="${C.row}">${fl("المعمودية","baptism",fam.baptism)}${fl("الخطوبة بكنيسة","engagementChurch",fam.engagementChurch)}</div>
  <div style="${C.row}">${fl("تاريخ الخطوبة","engagementDate",fam.engagementDate)}${fl("إكليل بكنيسة","crownChurch",fam.crownChurch)}</div>
  <div style="${C.row}">${fl("تاريخ الإكليل","crownDate",fam.crownDate)}</div>

  <div style="${C.sec}">✦ الحالة</div>
  <div style="${C.row}">
    ${flSel("الحالة","statusZJMD",fam.statusZJMD,["","ز","ج","م","ض"])}

  const bb=document.getElementById("mv_b");
  ss.innerHTML=`<option value="">الشارع</option>${(area?.streets||[]).map(s=>`<option value="${s.id}">${escHtml(s.name)}</option>`).join("")}`;
  bb.innerHTML=`<option value="">المنزل</option>`;
  ss.onchange=()=>{
    const sId=parseInt(ss.value);
    const street=area?.streets.find(s=>s.id===sId);
    bb.innerHTML=`<option value="">المنزل</option>${(street?.buildings||[]).map(b=>`<option value="${b.id}">${escHtml(b.name)}</option>`).join("")}`;
  };
};

  if(!toA||!toS||!toB){alert("اختر المنطقة والشارع والمنزل");return;}

};

window.getFormData = (modalId) => {
  const data={};
  document.querySelectorAll(`#${modalId} [data-key]`).forEach(el=>{data[el.dataset.key]=el.value;});
  return data;
};

function _renderContent(){
  const el = document.getElementById("pageContent");
  if(!el||!state.data) return;
  el.innerHTML = getPageHTML();
}

function getPageHTML(){
  const path=state.path;
  const area=path[0]?state.data.areas.find(a=>a.id===path[0].id):null;
  const street=path[1]?area?.streets.find(s=>s.id===path[1].id):null;
  const building=path[2]?street?.buildings.find(b=>b.id===path[2].id):null;

  if(path.length===0) return renderHome();
  if(path.length===1&&area) return renderArea(area);
  if(path.length===2&&area&&street) return renderStreet(area,street);
  if(path.length===3&&area&&street&&building) return renderBuilding(area,street,building);
  return "";
}

function renderHome(){
  const q=state.localSearch.toLowerCase();
  
  let globalResults=[];
  if(q.length>=2){
    state.data.areas.forEach(area=>{
      area.streets.forEach(street=>{
        street.buildings.forEach(building=>{
          building.families.forEach(fam=>{
            const hf=[fam.husbandName,fam.husbandPhone,fam.husbandBirthdate,fam.husbandFather,fam.husbandQualification,fam.husbandWork,fam.husbandWorkPlace,fam.husbandExtraWork,fam.husbandEmail,fam.husbandNationalId,fam.husbandSunDegree,fam.churchService,fam.baptism,fam.notes,String(fam.code||"")];
            if(hf.some(v=>v&&v.toString().toLowerCase().includes(q)))
              globalResults.push({type:"husband",name:fam.husbandName||"(بدون اسم)",fam,area,street,building});
            const wf=[fam.wifeName,fam.wifePhone,fam.wifeBirthdate,fam.wifeFather,fam.wifeQualification,fam.wifeWork,fam.wifeWorkPlace,fam.wifeExtraWork,fam.wifeEmail,fam.wifeNationalId,fam.wifeDeathDate,fam.wifeChurchService];
            if(wf.some(v=>v&&v.toString().toLowerCase().includes(q)))
              globalResults.push({type:"wife",name:fam.wifeName||"(بدون اسم)",fam,area,street,building});
            (fam.children||[]).forEach(child=>{
              if(childAllFields(child).some(v=>v&&v.toString().toLowerCase().includes(q)))
                globalResults.push({type:"child",name:child.name||"(بدون اسم)",fam,area,street,building});
            });
          });
        });
      });
    });
  }

  const areas=state.data.areas;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <span style="color:#B8962E;font-size:15px">المناطق</span>
      <button style="${C.btn}" onclick="_setModal({type:'addArea'})">+ منطقة</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="search-input" id="srch" placeholder="🔍 بحث شامل في كل المناطق..." value="${escHtml(state.localSearch)}" onkeydown="if(event.key==='Enter'){_setSearch(this.value);this.blur()}" style="flex:1">
      <button style="${C.btn}" onclick="_setSearch(document.getElementById('srch').value)">بحث</button>
      ${state.localSearch?'<button style="background:#C0392B;color:#fff;border:none;border-radius:5px;padding:6px 12px;cursor:pointer" onclick="_setSearch(\'\')">✕ إلغاء</button>':""}
    </div>
    ${globalResults.length>0?`
    <div style="margin-bottom:16px">
      <div style="color:#B8962E;font-size:13px;margin-bottom:8px">نتائج البحث (${globalResults.length})</div>
      ${globalResults.map(({type,name,fam,area,street,building})=>`
        <div style="${C.famCard};cursor:pointer" onclick="_openFamilyGlobal(${area.id},${street.id},${building.id},${fam.id})">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="background:${type==="husband"?"#2C4A1A":type==="wife"?"#1A2C4A":"#3A2810"};color:#D4AF5A;border-radius:4px;padding:2px 7px;font-size:10px">${type==="husband"?"زوج":type==="wife"?"زوجة":"ابن/بنت"}</span>
            <span style="font-size:14px;font-weight:bold">${escHtml(name)}</span>
            <span style="font-size:11px;color:#B8962E">كود: ${fam.code}</span>
          </div>
          <div style="font-size:11px;color:#A89060">📍 ${escHtml(area.name)} › ${escHtml(street.name)} › ${escHtml(building.name)}</div>
        </div>`).join("")}
    </div>`:""}
    ${!state.localSearch?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">
      ${areas.map(area=>`
        <div style="${C.card}">
          <div onclick="_goTo('area',${area.id})" style="cursor:pointer">
            <div style="font-size:11px;color:#A89060;margin-bottom:4px">${area.code}</div>
            <div style="font-size:13px;font-weight:bold;margin-bottom:6px">${escHtml(area.name)}</div>
            <div style="font-size:11px;color:#A89060">${area.streets.length} شارع</div>
          </div>
          <div style="display:flex;gap:4px;justify-content:center;margin-top:8px">
            <button style="${C.btnSm}" onclick="event.stopPropagation();_setModal({type:'editArea',areaId:${area.id},name:'${escHtml(area.name)}'})">تعديل</button>
            <button style="${C.btnDanger}" onclick="event.stopPropagation();_deleteArea(${area.id})">حذف</button>
          </div>
        </div>`).join("")}
      <div style="background:transparent;border:1.5px dashed #4A3510;border-radius:10px;padding:12px;cursor:pointer;text-align:center;color:#A89060;font-size:22px" onclick="_setModal({type:'addArea'})">+</div>
    </div>`:""}
  `;
}
function renderArea(area){
  const q=state.localSearch.toLowerCase();
  let areaResults=[];
  if(q.length>=2){
    area.streets.forEach(street=>{
      street.buildings.forEach(building=>{
        building.families.forEach(fam=>{
          // Check husband fields
          const husbandFields = [fam.husbandName,fam.husbandPhone,fam.husbandBirthdate,fam.husbandFather,fam.husbandQualification,fam.husbandWork,fam.husbandWorkPlace,fam.husbandExtraWork,fam.husbandExtraWorkPlace,fam.husbandEmail,fam.husbandNationalId,fam.husbandSunDegree,fam.husbandDeathDate,fam.churchService,fam.baptism,fam.engagementChurch,fam.crownChurch,fam.statusZJMD,fam.notes,String(fam.code||"")];
          if(husbandFields.some(v=>v&&v.toString().toLowerCase().includes(q))){
            areaResults.push({type:"husband",name:fam.husbandName||"(بدون اسم)",sub:`كود: ${fam.code} · ${escHtml(street.name)} › ${escHtml(building.name)}`,fam,street,building});
          }
          // Check wife fields
          const wifeFields = [fam.wifeName,fam.wifePhone,fam.wifeBirthdate,fam.wifeFather,fam.wifeQualification,fam.wifeWork,fam.wifeWorkPlace,fam.wifeExtraWork,fam.wifeExtraWorkPlace,fam.wifeEmail,fam.wifeNationalId,fam.wifeDeathDate,fam.wifeChurchService];
          if(wifeFields.some(v=>v&&v.toString().toLowerCase().includes(q))){
            areaResults.push({type:"wife",name:fam.wifeName||"(بدون اسم)",sub:`كود: ${fam.code} · ${escHtml(street.name)} › ${escHtml(building.name)}`,fam,street,building});
          }
          // Check children
          (fam.children||[]).forEach(child=>{
            if(childAllFields(child).some(v=>v&&v.toString().toLowerCase().includes(q))){
              areaResults.push({type:"child",name:child.name||"(بدون اسم)",sub:`أسرة ${fam.husbandName||""} · ${escHtml(street.name)} › ${escHtml(building.name)}`,fam,street,building});
            }
          });
        });
      });
    });
  }
  const streets=q?area.streets.filter(s=>s.name.toLowerCase().includes(q)):area.streets;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <span style="color:#B8962E;font-size:15px">${escHtml(area.name)} <span style="font-size:11px;color:#A89060">(${area.code})</span></span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button style="${C.btnOutline}" onclick="_setModal({type:'editArea',areaId:${area.id},name:'${escHtml(area.name)}'})">تعديل</button>
        <button style="${C.btn}" onclick="_setModal({type:'addStreet',areaId:${area.id}})">+ شارع</button>
        <button style="${C.btnDanger}" onclick="_deleteArea(${area.id})">حذف</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="search-input" id="srch" placeholder="🔍 بحث باسم أو كود أو وظيفة..." value="${escHtml(state.localSearch)}" onkeydown="if(event.key==='Enter'){_setSearch(this.value);this.blur()}" style="flex:1">
      <button style="${C.btn}" onclick="_setSearch(document.getElementById('srch').value)">بحث</button>
      
    </div>
    ${areaResults.length>0?`
    <div style="margin-bottom:16px">
      <div style="color:#B8962E;font-size:13px;margin-bottom:8px">نتائج البحث (${areaResults.length})</div>
      ${areaResults.map(({type,name,sub,fam,street,building})=>`
        <div style="${C.famCard};cursor:pointer" onclick="_openFamily(${area.id},${street.id},${building.id},${fam.id})">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="background:${type==='husband'?'#2C4A1A':type==='wife'?'#1A2C4A':'#3A2810'};color:#D4AF5A;border-radius:4px;padding:2px 7px;font-size:10px">${type==='husband'?'زوج':type==='wife'?'زوجة':'ابن/بنت'}</span>
            <span style="font-size:14px;font-weight:bold">${escHtml(name)}</span>
          </div>
          <div style="font-size:11px;color:#A89060">${sub}</div>
        </div>`).join("")}
    </div>`:`
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">
      ${streets.map(street=>`
        <div style="${C.card}">
          <div onclick="_goTo('street',${street.id})" style="cursor:pointer">
            <div style="font-size:13px;font-weight:bold;margin-bottom:6px">${escHtml(street.name)}</div>
            <div style="font-size:11px;color:#A89060">${street.buildings.length} منزل</div>
          </div>
          <div style="display:flex;gap:4px;justify-content:center;margin-top:8px">
            <button style="${C.btnSm}" onclick="event.stopPropagation();_setModal({type:'editStreet',areaId:${area.id},streetId:${street.id},name:'${escHtml(street.name)}'})">تعديل</button>
            <button style="${C.btnDanger}" onclick="event.stopPropagation();_deleteStreet(${area.id},${street.id})">حذف</button>
          </div>
        </div>`).join("")}
      <div style="background:transparent;border:1.5px dashed #4A3510;border-radius:10px;padding:12px;cursor:pointer;text-align:center;color:#A89060;font-size:22px" onclick="_setModal({type:'addStreet',areaId:${area.id}})">+</div>
    </div>`}`;
}

function renderStreet(area,street){
  const q=state.localSearch.toLowerCase();
  const buildings=q?street.buildings.filter(b=>b.name.toLowerCase().includes(q)):street.buildings;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <span style="color:#B8962E;font-size:15px">${escHtml(street.name)}</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button style="${C.btnOutline}" onclick="_setModal({type:'editStreet',areaId:${area.id},streetId:${street.id},name:'${escHtml(street.name)}'})">تعديل</button>
        <button style="${C.btn}" onclick="_setModal({type:'addBuilding',areaId:${area.id},streetId:${street.id}})">+ منزل</button>
        <button style="${C.btnDanger}" onclick="_deleteStreet(${area.id},${street.id})">حذف</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="search-input" id="srch" placeholder="🔍 بحث في المنازل..." value="${escHtml(state.localSearch)}" onkeydown="if(event.key==='Enter'){_setSearch(this.value);this.blur()}" style="flex:1">
      <button style="${C.btn}" onclick="_setSearch(document.getElementById('srch').value)">بحث</button>
      
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">
      ${buildings.map(b=>`
        <div style="${C.card}">
          <div onclick="_goTo('building',${b.id})" style="cursor:pointer">
            <div style="font-size:13px;font-weight:bold;margin-bottom:6px">${escHtml(b.name)}</div>
            <div style="font-size:11px;color:#A89060">${b.families.length} أسرة</div>
          </div>
          <div style="display:flex;gap:4px;justify-content:center;margin-top:8px">
            <button style="${C.btnSm}" onclick="event.stopPropagation();_setModal({type:'editBuilding',areaId:${area.id},streetId:${street.id},buildingId:${b.id},name:'${escHtml(b.name)}'})">تعديل</button>
            <button style="${C.btnDanger}" onclick="event.stopPropagation();_deleteBuilding(${area.id},${street.id},${b.id})">حذف</button>
          </div>
        </div>`).join("")}
      <div style="background:transparent;border:1.5px dashed #4A3510;border-radius:10px;padding:12px;cursor:pointer;text-align:center;color:#A89060;font-size:22px" onclick="_setModal({type:'addBuilding',areaId:${area.id},streetId:${street.id}})">+</div>
    </div>`;
}

function renderBuilding(area,street,building){
  const q=state.localSearch.toLowerCase();
  const families=q?building.families.filter(f=>famAllFields(f).some(v=>v&&v.toString().toLowerCase().includes(q))||(f.children||[]).some(c=>childAllFields(c).some(v=>v&&v.toLowerCase().includes(q)))):building.families;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <span style="color:#B8962E;font-size:15px">${escHtml(building.name)}</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button style="${C.btnOutline}" onclick="_setModal({type:'editBuilding',areaId:${area.id},streetId:${street.id},buildingId:${building.id},name:'${escHtml(building.name)}'})">تعديل</button>
        <button style="${C.btn}" onclick="_setModal({type:'addFamily',areaId:${area.id},streetId:${street.id},buildingId:${building.id}})">+ أسرة</button>
        <button style="${C.btnDanger}" onclick="_deleteBuilding(${area.id},${street.id},${building.id})">حذف</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="search-input" id="srch" placeholder="🔍 بحث في الأسر..." value="${escHtml(state.localSearch)}" onkeydown="if(event.key==='Enter'){_setSearch(this.value);this.blur()}" style="flex:1">
      <button style="${C.btn}" onclick="_setSearch(document.getElementById('srch').value)">بحث</button>
      
    </div>
    ${families.length===0?'<div style="text-align:center;color:#A89060;margin-top:30px;font-size:13px">لا توجد نتائج</div>':""}
    ${families.map(fam=>`
      <div style="${C.famCard}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="cursor:pointer;flex:1" onclick="_openFamily(${area.id},${street.id},${building.id},${fam.id})">
            <div style="font-size:11px;color:#B8962E;margin-bottom:3px">كود: ${fam.code}</div>
            <div style="font-size:14px;font-weight:bold;margin-bottom:3px">${escHtml(fam.husbandName||"")}${fam.wifeName?" & "+escHtml(fam.wifeName):""}</div>
            <div style="font-size:11px;color:#A89060">${escHtml(fam.husbandPhone||"")}</div>
          </div>
          <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
            <span style="${C.tag}">${(fam.children||[]).length} أبناء</span>
            <button style="${C.btnSm}" onclick="_setModal({type:'editFamily',areaId:${area.id},streetId:${street.id},buildingId:${building.id},famId:${fam.id}})">تعديل</button>
            <button style="${C.btnDanger}" onclick="_deleteFamily(${area.id},${street.id},${building.id},${fam.id})">حذف</button>
          </div>
        </div>
      </div>`).join("")}`;
}

function render(){
  if(!state.data){
    document.getElementById("root").innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px"><div style="font-size:30px;color:#B8962E">✞</div><div style="color:#B8962E;font-size:16px">جاري التحميل...</div></div>`;
    return;
  }
  const path=state.path;
  const area=path[0]?state.data.areas.find(a=>a.id===path[0].id):null;
  const street=path[1]?area?.streets.find(s=>s.id===path[1].id):null;
  const building=path[2]?street?.buildings.find(b=>b.id===path[2].id):null;

  document.getElementById("root").innerHTML=`
    <div style="background:linear-gradient(135deg,#0D0800,#2C1F0A);border-bottom:2px solid #B8962E;padding:14px 24px;text-align:center">
      <div style="font-size:20px;color:#B8962E;margin-bottom:4px">✞</div>
      <div style="font-size:12px;color:#A89060;margin-bottom:2px">مطرانية الأقباط الأرثوذكس بطهطا وجهينة</div>
      <div style="font-size:18px;color:#B8962E;font-weight:bold;margin-bottom:2px">برنامج متابعة الأسر</div>
      <div style="font-size:12px;color:#A89060">كنيسة الأنبا شنودة رئيس المتوحدين</div>
    </div>
    <div id="syncbar" style="background:#0D1F0D;border-bottom:1px solid #1A3A1A;padding:6px 16px;font-size:11px;text-align:center;color:${state.syncing?"#F0A500":"#4CAF50"}">
      ${state.syncing?"⏳ جاري الحفظ...":"✅ محفوظ ومتزامن · "+(state.lastSync?.toLocaleTimeString("ar-EG")||"")}
    </div>
    <div style="background:#110D04;border-bottom:1px solid #4A3510;padding:10px 16px">
      <div style="display:flex;gap:8px">
        <input class="search-input" id="gsrch" placeholder="🔍 بحث شامل في كل البرنامج..." value="${escHtml(state.globalSearch)}" onkeydown="if(event.key==='Enter'){_doGlobalSearch(this.value);this.blur()}" style="flex:1">
        <button style="${C.btn}" onclick="_doGlobalSearch(document.getElementById('gsrch').value)">بحث</button>
        ${state.globalSearch?'<button style="background:#C0392B;color:#fff;border:none;border-radius:5px;padding:6px 10px;cursor:pointer" onclick="state.globalSearch=\'\';state.globalResults=[];render()">✕</button>':""}
      </div>
      ${state.globalResults.length>0?`
      <div style="margin-top:10px;max-height:300px;overflow-y:auto">
        <div style="color:#B8962E;font-size:12px;margin-bottom:8px">نتائج البحث (${state.globalResults.length})</div>
        ${state.globalResults.map((r,i)=>`
          <div style="background:#2C1F0A;border:1px solid #4A3510;border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer" onclick="_openGlobalResult(${i})">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              <span style="background:#3A2810;color:#D4AF5A;border-radius:4px;padding:2px 7px;font-size:10px">${r.type}</span>
              <span style="font-size:14px;font-weight:bold;color:#F5EDD6">${escHtml(r.label)}</span>
            </div>
            <div style="font-size:11px;color:#A89060">📍 ${r.loc} · كود: ${r.fam.code}</div>
          </div>`).join("")}
      </div>`:""}
    </div>
    ${path.length>0?`
    <div style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:#110D04;border-bottom:1px solid #4A3510">
      <button style="background:#2C1F0A;border:1px solid #4A3510;color:#D4AF5A;cursor:pointer;font-size:13px;padding:5px 14px;border-radius:6px" onclick="_goBack()">← رجوع</button>
      <button style="background:none;border:none;color:#A89060;cursor:pointer;font-size:16px" onclick="_goHome()">🏠</button>
      <span style="color:#A89060;font-size:12px">${area?escHtml(area.name):""} ${street?"› "+escHtml(street.name):""} ${building?"› "+escHtml(building.name):""}</span>
    </div>`:""}
    <div style="padding:16px;max-width:900px;margin:0 auto" id="pageContent">
      ${getPageHTML()}
    </div>
    ${renderFamilyDetail()}
    ${renderModal()}
  `;
}
</script>
</body>
</html>
