<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامج متابعة الأسر - كنيسة الأنبا شنودة</title>
<meta name="theme-color" content="#1A1208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="متابعة الأسر">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:#1A1208; color:#F5EDD6; direction:rtl; min-height:100vh; }
input,select,textarea { font-family:'Segoe UI',Tahoma,sans-serif; direction:rtl; }
.search-input { width:100%; background:#1F1505; border:1px solid #B8962E; border-radius:8px; padding:9px 14px; color:#F5EDD6; font-size:14px; box-sizing:border-box; }
.field-input { width:100%; background:#1F1505; border:1px solid #4A3510; border-radius:6px; padding:7px 10px; color:#F5EDD6; font-size:13px; box-sizing:border-box; }
select.field-input option { background:#1F1505; }
@media (max-width:700px){ .field-input, .search-input { font-size:16px !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtSEqHUg1G81ReynWCImQurttmeyqblhM",
  authDomain: "meena-253b3.firebaseapp.com",
  projectId: "meena-253b3",
  storageBucket: "meena-253b3.firebasestorage.app",
  messagingSenderId: "612273445379",
  appId: "1:612273445379:web:33b2fcd882616feaa5cc36"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DATA_DOC = doc(db, "church", "families");

const initialData = { areas: [] };

let state = { data: null, path: [], modal: null, viewFamily: null, localSearch: "", globalSearch: "", globalResults: [], syncing: false, lastSync: null };

onSnapshot(DATA_DOC, (snap) => {
  if (snap.exists()) {
    const raw = snap.data().data;
    const fixed = normalizeCodes(raw);
    state.data = fixed;
    if (JSON.stringify(fixed) !== JSON.stringify(raw)) save(fixed);
  }
  else { setDoc(DATA_DOC, { data: initialData }); state.data = initialData; }
  state.lastSync = new Date();
  if (isTyping() || state.modal) { state.pendingRender = true; renderSyncBar(); }
  else render();
});

function isTyping() {
  const a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
document.addEventListener("focusout", () => setTimeout(() => {
  if (state.pendingRender && !state.modal && !isTyping()) render();
}, 300));

async function save(newData) {
  state.syncing = true; renderSyncBar();
  await setDoc(DATA_DOC, { data: newData });
  state.syncing = false; state.lastSync = new Date(); renderSyncBar();
}

function renderSyncBar() {
  const bar = document.getElementById("syncbar");
  if (bar) bar.innerHTML = state.syncing ? "⏳ جاري الحفظ..." : `✅ محفوظ ومتزامن · ${state.lastSync?.toLocaleTimeString("ar-EG")||""}`;
}

function updateData(fn) {
  const newData = normalizeCodes(fn(state.data));
  state.data = newData;
  save(newData);
  render();
}

// ترقيم متصل لأكواد الأسر داخل كل منطقة (عبر كل الشوارع والمنازل بالترتيب)
const recodeAreaContinuous = a => { let n = 0; return {...a, streets:(a.streets||[]).map(s=>({...s, buildings:(s.buildings||[]).map(b=>({...b, families:(b.families||[]).map(f=>({...f, code:a.code+(++n)}))}))}))}; };
const normalizeCodes = d => ({...d, areas:(d.areas||[]).map(recodeAreaContinuous)});

// أعداد
const famMembers = f => (f.husbandName?1:0)+(f.wifeName?1:0)+(f.children||[]).length;
const areaFamCount = a => (a.streets||[]).reduce((t,s)=>t+(s.buildings||[]).reduce((u,b)=>u+(b.families||[]).length,0),0);

// ===== البحث في كل البيانات =====
const normAr = t => String(t==null?"":t).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim();
const _SKIP_KEYS = ["id","children","streets","buildings","families"];
const allVals = o => Object.keys(o||{}).filter(k=>!_SKIP_KEYS.includes(k)).map(k=>o[k]);
const _fpCache = new WeakMap();
function famParts(f){
  let p=_fpCache.get(f);
  if(!p){
    const hk=[],wk=[],fk=[];
    Object.keys(f).forEach(k=>{
      if(_SKIP_KEYS.includes(k)) return;
      if(k.startsWith("husband")||k==="churchService") hk.push(f[k]);
      else if(k.startsWith("wife")) wk.push(f[k]);
      else fk.push(f[k]);
    });
    const j=a=>normAr(a.map(v=>v==null?"":v).join(" | "));
    p={h:j(hk),w:j(wk),f:j(fk),kids:(f.children||[]).map(c=>({c,t:j(allVals(c))}))};
    _fpCache.set(f,p);
  }
  return p;
}
const famMatches = (f,q) => { const p=famParts(f); return p.h.includes(q)||p.w.includes(q)||p.f.includes(q)||p.kids.some(k=>k.t.includes(q)); };
const kidHit = (fam,q) => { if(!q) return ""; const k=famParts(fam).kids.find(k=>k.t.includes(q)); return k?`<div style="font-size:11px;color:#D4AF5A;margin-top:3px">👶 ${escHtml(k.c.name||"")}</div>`:""; };
function searchAll(areas,q){
  const out=[];
  areas.forEach(area=>{
    if(normAr(area.name).includes(q)) out.push({kind:"area",type:"area",label:area.name,area});
    area.streets.forEach(street=>{
      if(normAr(street.name).includes(q)) out.push({kind:"street",type:"street",label:street.name,area,street});
      street.buildings.forEach(building=>{
        if(normAr(building.name).includes(q)) out.push({kind:"building",type:"building",label:building.name,area,street,building});
        building.families.forEach(fam=>{
          const p=famParts(fam);
          const base={kind:"person",area,street,building,fam};
          if(p.h.includes(q)) out.push({...base,type:"husband",label:fam.husbandName||"(بدون اسم)"});
          if(p.w.includes(q)) out.push({...base,type:"wife",label:fam.wifeName||"(بدون اسم)"});
          if(p.f.includes(q)) out.push({...base,type:"family",label:"أسرة "+(fam.husbandName||"")});
          p.kids.forEach(k=>{ if(k.t.includes(q)) out.push({...base,type:"child",label:k.c.name||"(بدون اسم)"}); });
        });
      });
    });
  });
  return out;
}
const RES_TYPES={husband:["زوج","#2C4A1A"],wife:["زوجة","#1A2C4A"],family:["الأسرة","#4A2C1A"],child:["ابن/بنت","#3A2810"],area:["منطقة","#3A1A4A"],street:["شارع","#1A4A4A"],building:["منزل","#4A4A1A"]};
function resultCardHTML(r,click,withArea){
  const [lbl,bg]=RES_TYPES[r.type];
  const loc=[];
  if(withArea&&r.kind!=="area") loc.push(r.area.name);
  if(r.street&&r.kind!=="street") loc.push(r.street.name);
  if(r.building&&r.kind!=="building") loc.push(r.building.name);
  return `<div style="${C.famCard};cursor:pointer;padding:10px" onclick="${click}">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
      <span style="background:${bg};color:#D4AF5A;border-radius:4px;padding:2px 7px;font-size:10px">${lbl}</span>
      <span style="font-size:14px;font-weight:bold">${escHtml(r.label)}</span>
      ${r.fam?`<span style="font-size:11px;color:#B8962E">كود: ${r.fam.code}</span>`:""}
    </div>
    ${loc.length?`<div style="font-size:11px;color:#A89060">📍 ${loc.map(x=>escHtml(x)).join(" › ")}</div>`:""}
  </div>`;
}
const resultClick = r => r.kind==="person"
  ? `_openFamilyGlobal(${r.area.id},${r.street.id},${r.building.id},${r.fam.id})`
  : `_jumpTo(${r.area.id}${r.street?","+r.street.id:""}${r.building?","+r.building.id:""})`;
function globalResultsHTML(){
  if(!state.globalSearch) return "";
  if(normAr(state.globalSearch).length<2) return '<div style="margin-top:8px;color:#A89060;font-size:12px">اكتب حرفين على الأقل</div>';
  if(state.globalResults.length===0) return '<div style="margin-top:8px;color:#A89060;font-size:12px">لا توجد نتائج</div>';
  return `<div style="margin-top:10px;max-height:300px;overflow-y:auto">
    <div style="color:#B8962E;font-size:12px;margin-bottom:8px">نتائج البحث (${state.globalTotal})${state.globalTotal>state.globalResults.length?` — عرض أول ${state.globalResults.length}`:""}</div>
    ${state.globalResults.map((r,i)=>resultCardHTML(r,`_openGlobalResult(${i})`,true)).join("")}
  </div>`;
}

const recodeFamilies = (families, areaCode) => families.map((f,i) => ({...f, code: areaCode+i+1}));
const nextAreaCode = () => state.data.areas.length===0 ? 1000 : Math.max(...state.data.areas.map(a=>a.code))+1000;

// CRUD
window._addArea = n => updateData(d => ({...d, areas:[...d.areas,{id:Date.now(),code:nextAreaCode(),name:n,streets:[]}]}));
window._editArea = (id,n) => updateData(d => ({...d, areas:d.areas.map(a=>a.id===id?{...a,name:n}:a)}));
window._deleteArea = id => { if(!confirm("حذف المنطقة؟"))return; updateData(d=>{const f=d.areas.filter(a=>a.id!==id);return{...d,areas:f.map((a,i)=>({...a,code:(i+1)*1000}))}}); state.path=[]; render(); };

window._addStreet = (aId,n) => updateData(d=>({...d,areas:d.areas.map(a=>a.id===aId?{...a,streets:[...a.streets,{id:Date.now(),name:n,buildings:[]}]}:a)}));
window._editStreet = (aId,sId,n) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id===sId?{...s,name:n}:s)})}));
window._deleteStreet = (aId,sId) => { if(!confirm("حذف الشارع؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.filter(s=>s.id!==sId)})})); state.path=state.path.slice(0,1); render(); };

window._addBuilding = (aId,sId,n) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:[...s.buildings,{id:Date.now(),name:n,families:[]}]})})}));
window._editBuilding = (aId,sId,bId,n) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,name:n})})})}));
window._deleteBuilding = (aId,sId,bId) => { if(!confirm("حذف المنزل؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.filter(b=>b.id!==bId)})})})); state.path=state.path.slice(0,2); render(); };

window._addFamily = (aId,sId,bId,fam,children=[]) => updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:recodeFamilies([...b.families,{...fam,id:Date.now(),children:children}],a.code)})})})}));
window._editFamily = (aId,sId,bId,fId,fam,children) => { updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,...fam,children:children!==undefined?children:f.children})})})})})); if(state.viewFamily) state.viewFamily={...state.viewFamily,fam:{...state.viewFamily.fam,...fam,children:children!==undefined?children:state.viewFamily.fam.children}}; };
window._deleteFamily = (aId,sId,bId,fId) => { if(!confirm("حذف الأسرة؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:recodeFamilies(b.families.filter(f=>f.id!==fId),a.code)})})})})); state.viewFamily=null; render(); };

// تنقل بين تاب بيانات الأسرة وتاب الأبناء جوه فورم إضافة/تعديل الأسرة (قبل الحفظ النهائي)
window._famSwitchTab = (tab) => {
  const m = state.modal;
  if(!m) return;
  if(m.activeTab==="family") m.famData = {...m.famData, ...getFormData('famModal')};
  m.activeTab = tab;
  render();
};
window._famOpenChildEditor = (childId) => {
  const m = state.modal;
  if(!m) return;
  m.childEditor = childId==null ? {id:null,data:{}} : {id:childId,data:{...m.children.find(c=>c.id===childId)}};
  render();
};
window._famCancelChildEditor = () => { const m=state.modal; if(!m)return; m.childEditor=null; render(); };
window._famSaveChildEditor = () => {
  const m = state.modal;
  if(!m) return;
  const data = getFormData('childEditorForm');
  if(m.childEditor.id==null){
    const newId = Date.now()+Math.floor(Math.random()*1000)+m.children.length;
    m.children = [...m.children, {...data, id:newId}];
  } else {
    m.children = m.children.map(c=>c.id===m.childEditor.id?{...c,...data}:c);
  }
  m.childEditor = null;
  render();
};
window._famDeleteLocalChild = (childId) => {
  const m = state.modal;
  if(!m) return;
  if(!confirm("حذف الابن؟")) return;
  m.children = m.children.filter(c=>c.id!==childId);
  render();
};
window._famFinalSave = (mode,aId,sId,bId,fId) => {
  const m = state.modal;
  if(!m) return;
  if(m.activeTab==="family") m.famData = {...m.famData, ...getFormData('famModal')};
  if(mode==="add") window._addFamily(aId,sId,bId,m.famData,m.children);
  else window._editFamily(aId,sId,bId,fId,m.famData,m.children);
  _setModal(null);
};

window._moveFamily = (fromA,fromS,fromB,fId,toA,toS,toB) => {
  updateData(d=>{
    let moved=null;
    let areas=d.areas.map(a=>{if(a.id!==fromA)return a;return{...a,streets:a.streets.map(s=>{if(s.id!==fromS)return s;return{...s,buildings:s.buildings.map(b=>{if(b.id!==fromB)return b;moved=b.families.find(f=>f.id===fId);return{...b,families:recodeFamilies(b.families.filter(f=>f.id!==fId),a.code)};})};})};});
    if(!moved)return d;
    areas=areas.map(a=>{if(a.id!==toA)return a;return{...a,streets:a.streets.map(s=>{if(s.id!==toS)return s;return{...s,buildings:s.buildings.map(b=>{if(b.id!==toB)return b;return{...b,families:recodeFamilies([...b.families,{...moved}],a.code)};})};})};});
    return{...d,areas};
  });
  state.viewFamily=null; state.modal=null; render();
};

window._addChild = (aId,sId,bId,fId,child) => { updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,children:[...(f.children||[]),{...child,id:Date.now()}]})})})})})); _refreshViewFamily(aId,sId,bId,fId); };
window._editChild = (aId,sId,bId,fId,cId,child) => { updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,children:f.children.map(c=>c.id!==cId?c:{...c,...child})})})})})})); _refreshViewFamily(aId,sId,bId,fId); };
window._deleteChild = (aId,sId,bId,fId,cId) => { if(!confirm("حذف الابن؟"))return; updateData(d=>({...d,areas:d.areas.map(a=>a.id!==aId?a:{...a,streets:a.streets.map(s=>s.id!==sId?s:{...s,buildings:s.buildings.map(b=>b.id!==bId?b:{...b,families:b.families.map(f=>f.id!==fId?f:{...f,children:f.children.filter(c=>c.id!==cId)})})})})})); _refreshViewFamily(aId,sId,bId,fId); };

function _refreshViewFamily(aId,sId,bId,fId) {
  if(!state.viewFamily)return;
  const area=state.data.areas.find(a=>a.id===aId);
  const fam=area?.streets.find(s=>s.id===sId)?.buildings.find(b=>b.id===bId)?.families.find(f=>f.id===fId);
  if(fam) state.viewFamily={...state.viewFamily,fam};
}

window._goHome = () => { state.path=[]; state.localSearch=""; render(); };

let _gT=null, _sT=null;
window._doGlobalSearch = (q) => {
  state.globalSearch = q;
  const c=document.getElementById("gclear"); if(c) c.style.display=q?"inline-block":"none";
  clearTimeout(_gT);
  _gT=setTimeout(()=>{
    const n=normAr(q);
    const all=n.length>=2?searchAll(state.data.areas,n):[];
    state.globalTotal=all.length; state.globalResults=all.slice(0,100);
    const box=document.getElementById("gResults"); if(box) box.innerHTML=globalResultsHTML();
  },120);
};
window._clearGlobal = () => {
  clearTimeout(_gT);
  state.globalSearch=""; state.globalResults=[]; state.globalTotal=0;
  const i=document.getElementById("gsrch"); if(i) i.value="";
  const box=document.getElementById("gResults"); if(box) box.innerHTML="";
  const c=document.getElementById("gclear"); if(c) c.style.display="none";
};
window._jumpTo = (aId,sId,bId) => {
  state.path=[{type:"area",id:aId}];
  if(sId) state.path.push({type:"street",id:sId});
  if(bId) state.path.push({type:"building",id:bId});
  state.localSearch=""; render();
};
window._goTo = (type,id) => { state.path=[...state.path,{type,id}]; state.localSearch=""; render(); };
window._goBack = () => { state.path=state.path.slice(0,-1); state.localSearch=""; render(); };
window._setModal = m => { state.modal=m; render(); };
window._setViewFamily = vf => { state.viewFamily=vf; render(); };
window._setSearch = v => {
  state.localSearch=v;
  const c=document.getElementById("srchClear"); if(c) c.style.display=v?"inline-block":"none";
  clearTimeout(_sT); _sT=setTimeout(_renderResults,120);
};
window._clearSearch = () => { const i=document.getElementById("srch"); if(i) i.value=""; _setSearch(""); };

window._openGlobalResult = (i) => {
  const r = state.globalResults[i];
  if(!r) return;
  state.globalSearch = ""; state.globalResults = []; state.globalTotal = 0;
  state.path = [{type:"area",id:r.area.id}];
  if(r.street) state.path.push({type:"street",id:r.street.id});
  if(r.building) state.path.push({type:"building",id:r.building.id});
  state.localSearch = "";
  state.viewFamily = r.fam ? {fam:r.fam, areaId:r.area.id, streetId:r.street.id, buildingId:r.building.id} : null;
  render();
};

window._openFamilyGlobal = (aId,sId,bId,fId) => {
  const area=state.data.areas.find(a=>a.id===aId);
  const street=area?.streets.find(s=>s.id===sId);
  const building=street?.buildings.find(b=>b.id===bId);
  const fam=building?.families.find(f=>f.id===fId);
  if(fam){state.viewFamily={fam,areaId:aId,streetId:sId,buildingId:bId};render();}
};
window._openFamily = (aId,sId,bId,fId) => {
  const area=state.data.areas.find(a=>a.id===aId);
  const street=area?.streets.find(s=>s.id===sId);
  const building=street?.buildings.find(b=>b.id===bId);
  const fam=building?.families.find(f=>f.id===fId);
  if(fam){state.viewFamily={fam,areaId:aId,streetId:sId,buildingId:bId};render();}
};

// All family fields for search
function famAllFields(f) {
  return [f.husbandName,f.wifeName,f.husbandPhone,f.wifePhone,String(f.code||""),
    f.husbandBirthdate,f.wifeBirthdate,f.husbandFather,f.wifeFather,
    f.husbandQualification,f.wifeQualification,f.husbandWork,f.wifeWork,
    f.husbandWorkPlace,f.wifeWorkPlace,f.husbandExtraWork,f.wifeExtraWork,
    f.husbandExtraWorkPlace,f.wifeExtraWorkPlace,
    f.husbandEmail,f.wifeEmail,f.husbandNationalId,f.wifeNationalId,
    f.husbandSunDegree,f.churchService,f.wifeChurchService,f.baptism,
    f.engagementChurch,f.crownChurch,f.husbandDeathDate,f.wifeDeathDate,
    f.statusAD,f.statusAKH,f.statusMD,f.statusZJMD,f.notes];
}

function childAllFields(c) {
  return [c.name,c.father,c.qualification,c.work,c.workPlace,c.phone,
    c.birthdate,c.gender,c.socialStatus,c.churchService,c.sunDegree,c.deathDate,c.email,c.notes,
    c.baptism,c.nationalId];
}

function escHtml(t){return(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  btnDanger:`background:#C0392B;color:#fff;border:none;border-radius:5px;padding:3px 9px;cursor:pointer;font-size:11px`,
  btnOutline:`background:transparent;color:#B8962E;border:1px solid #B8962E;border-radius:5px;padding:3px 9px;cursor:pointer;font-size:11px`,
  card:`background:#2C1F0A;border:1px solid #4A3510;border-radius:10px;padding:12px 10px;text-align:center`,
  modal:`position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px`,

};

function fl(label,key,val,type="text"){
  return `<div style="${C.half}"><div style="font-size:11px;color:#A89060;margin-bottom:3px">${label}</div><input class="field-input" type="${type}" value="${escHtml(val||"")}" data-key="${key}"${/phone|Phone/.test(key)?' inputmode="tel"':/NationalId|nationalId/.test(key)?' inputmode="numeric"':/mail|Mail/.test(key)?' inputmode="email" autocapitalize="off"':''} autocomplete="off"></div>`;
}
function flSel(label,key,val,opts){
  return `<div style="${C.half}"><div style="font-size:11px;color:#A89060;margin-bottom:3px">${label}</div><select class="field-input" data-key="${key}">${opts.map(o=>`<option ${val===o?"selected":""}>${o}</option>`).join("")}</select></div>`;
}

function getFormData(modalId){
  const data={};
  document.querySelectorAll(`#${modalId} [data-key]`).forEach(el=>{data[el.dataset.key]=el.value;});
  return data;
}

function renderModal(){
  const m = state.modal;
  if(!m) return "";
  if(m.type==="addArea") return nameModalHTML("إضافة منطقة","_addArea(document.getElementById('nameInput').value);_setModal(null)","منطقة أبونا");
  if(m.type==="editArea") return nameModalHTML("تعديل المنطقة",`_editArea(${m.areaId},document.getElementById('nameInput').value);_setModal(null)`,m.name);
  if(m.type==="addStreet") return nameModalHTML("إضافة شارع",`_addStreet(${m.areaId},document.getElementById('nameInput').value);_setModal(null)`);
  if(m.type==="editStreet") return nameModalHTML("تعديل الشارع",`_editStreet(${m.areaId},${m.streetId},document.getElementById('nameInput').value);_setModal(null)`,m.name);
  if(m.type==="addBuilding") return nameModalHTML("إضافة منزل",`_addBuilding(${m.areaId},${m.streetId},document.getElementById('nameInput').value);_setModal(null)`);
  if(m.type==="editBuilding") return nameModalHTML("تعديل المنزل",`_editBuilding(${m.areaId},${m.streetId},${m.buildingId},document.getElementById('nameInput').value);_setModal(null)`,m.name);

  if(m.type==="addFamily"||m.type==="editFamily"){
    let fam={};
    if(m.type==="editFamily"){
      const a=state.data.areas.find(a=>a.id===m.areaId);
      fam=a?.streets.find(s=>s.id===m.streetId)?.buildings.find(b=>b.id===m.buildingId)?.families.find(f=>f.id===m.famId)||{};
    }
    if(!m.famData){ m.famData = m.type==="editFamily" ? {...fam} : {}; m.children = m.type==="editFamily" ? [...(fam.children||[])] : []; m.activeTab = "family"; m.childEditor = null; }
    const saveFn = m.type==="addFamily"
      ? `_famFinalSave('add',${m.areaId},${m.streetId},${m.buildingId})`
      : `_famFinalSave('edit',${m.areaId},${m.streetId},${m.buildingId},${m.famId})`;
    return `<div style="${C.modal}" onclick="if(event.target===this)_setModal(null)"><div style="${C.modalBox}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="color:#B8962E;font-size:15px;font-weight:bold">${m.type==="addFamily"?"إضافة أسرة":"تعديل الأسرة"}</span>
        <button onclick="_setModal(null)" style="background:none;border:none;color:#A89060;font-size:18px;cursor:pointer">✕</button>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid #4A3510;padding-bottom:10px">
        <button style="${m.activeTab==='family'?C.btn:C.btnOutline}" onclick="_famSwitchTab('family')">بيانات الأسرة</button>
        <button style="${m.activeTab==='children'?C.btn:C.btnOutline}" onclick="_famSwitchTab('children')">الأبناء (${m.children.length})</button>
      </div>
      ${m.activeTab==="family" ? `<div id="famModal">${familyFormHTML(m.famData)}</div>` : famChildrenTabHTML(m)}
      <div style="text-align:center;margin-top:14px"><button style="${C.btn}" onclick="${saveFn}">حفظ</button></div>
    </div></div>`;
  }

  if(m.type==="addChild"||m.type==="editChild"){
    let child={};
    if(m.type==="editChild"){
      const a=state.data.areas.find(a=>a.id===m.areaId);
      const fam=a?.streets.find(s=>s.id===m.streetId)?.buildings.find(b=>b.id===m.buildingId)?.families.find(f=>f.id===m.famId);
      child=fam?.children?.find(c=>c.id===m.childId)||{};
    }
    const saveFn = m.type==="addChild"
      ? `_addChild(${m.areaId},${m.streetId},${m.buildingId},${m.famId},getFormData('childModal'));_setModal(null)`
      : `_editChild(${m.areaId},${m.streetId},${m.buildingId},${m.famId},${m.childId},getFormData('childModal'));_setModal(null)`;
    return `<div style="${C.modal}" onclick="if(event.target===this)_setModal(null)"><div style="${C.modalBox}" id="childModal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <span style="color:#B8962E;font-size:15px;font-weight:bold">${m.type==="addChild"?"إضافة ابن/بنت":"تعديل الابن"}</span>
        <button onclick="_setModal(null)" style="background:none;border:none;color:#A89060;font-size:18px;cursor:pointer">✕</button>
      </div>
      ${childFormHTML(child)}
      <div style="text-align:center;margin-top:12px"><button style="${C.btn}" onclick="${saveFn}">حفظ</button></div>
    </div></div>`;
  }
  return "";
}

        <div style="font-size:11px;color:#A89060;margin-bottom:2px">المؤهل</div><div style="font-size:13px;margin-bottom:6px">${escHtml(fam.wifeQualification||"—")}</div>
        <div style="font-size:11px;color:#A89060;margin-bottom:2px">العمل الأساسي</div><div style="font-size:13px;margin-bottom:6px">${escHtml(fam.wifeWork||"—")}</div>
        <div style="font-size:11px;color:#A89060;margin-bottom:2px">مكان العمل</div><div style="font-size:13px;margin-bottom:6px">${escHtml(fam.wifeWorkPlace||"—")}</div>
        <div style="font-size:11px;color:#A89060;margin-bottom:2px">العمل الإضافي</div><div style="font-size:13px;margin-bottom:6px">${escHtml(fam.wifeExtraWork||"—")}</div>
        <div style="font-size:11px;color:#A89060;margin-bottom:2px">مكان العمل الإضافي</div><div style="font-size:13px;margin-bottom:6px">${escHtml(fam.wifeExtraWorkPlace||"—")}</div>
        <div style="font-size:11px;color:#A89060;margin-bottom:2px">Email</div><div style="font-size:13px;margin-bottom:6px">${escHtml(fam.wifeEmail||"—")}</div>
        <div style="font-size:11px;color:#A89060;margin-bottom:2px">الرقم القومي</div><div style="font-size:13px;margin-bottom:6px">${escHtml(fam.wifeNationalId||"—")}</div>
        <div style="font-size:11px;color:#A89060;margin-bottom:2px">تاريخ الوفاة</div><div style="font-size:13px;margin-bottom:6px">${escHtml(fam.wifeDeathDate||"—")}</div>
        <div style="font-size:11px;color:#A89060;margin-bottom:2px">الخدمة الكنسية</div><div style="font-size:13px;margin-bottom:6px">${escHtml(fam.wifeChurchService||"—")}</div>
      </div>
    </div>

    <div style="${C.sec}">✦ بيانات كنسية</div>
    ${row("المعمودية",fam.baptism,"الخطوبة",`${fam.engagementChurch||""} ${fam.engagementDate||""}`.trim())}
    ${row("الإكليل",`${fam.crownChurch||""} ${fam.crownDate||""}`.trim())}

    <div style="${C.sec}">✦ الحالة</div>
    ${row("الحالة",fam.statusZJMD,"ا.د",fam.statusAD)}
    ${row("ا.خ",fam.statusAKH,"م.د",fam.statusMD)}
    ${fam.notes?`<div style="color:#A89060;font-size:11px;margin-top:6px">ملاحظات: ${escHtml(fam.notes)}</div>`:""}

    <div style="${C.sec};display:flex;justify-content:space-between;align-items:center">
      <span>✦ الأبناء (${(fam.children||[]).length})</span>
      <button style="${C.btnSm}" onclick="_setModal({type:'addChild',areaId:${areaId},streetId:${streetId},buildingId:${buildingId},famId:${fam.id}})">+ إضافة</button>
    </div>
    ${(fam.children||[]).map(child=>`
      <div style="background:#1A0F04;border-radius:6px;padding:8px 10px;margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <div>
            <div style="font-size:13px;font-weight:bold">${escHtml(child.name)}</div>
            <div style="font-size:11px;color:#A89060">${escHtml(child.gender||"")} · ${escHtml(child.birthdate||"")} · ${escHtml(child.socialStatus||"")}</div>
          </div>
          <div style="display:flex;gap:5px">
            <button style="${C.btnSm}" onclick="_setModal({type:'editChild',areaId:${areaId},streetId:${streetId},buildingId:${buildingId},famId:${fam.id},childId:${child.id}})">تعديل</button>
            <button style="${C.btnDanger}" onclick="_deleteChild(${areaId},${streetId},${buildingId},${fam.id},${child.id})">حذف</button>
          </div>
        </div>
        <div style="font-size:11px;color:#A89060">${escHtml(child.father||"")} · ${escHtml(child.churchService||"")} · ${escHtml(child.work||"")}</div>
      </div>`).join("")}
  </div></div>`;
}

window._mvUpdateStreets = () => {
  const aId=parseInt(document.getElementById("mv_a").value);
  const area=state.data.areas.find(a=>a.id===aId);
  const ss=document.getElementById("mv_s");
  const bb=document.getElementById("mv_b");
  ss.innerHTML=`<option value="">الشارع</option>${(area?.streets||[]).map(s=>`<option value="${s.id}">${escHtml(s.name)}</option>`).join("")}`;
  bb.innerHTML=`<option value="">المنزل</option>`;
  ss.onchange=()=>{
    const sId=parseInt(ss.value);
    const street=area?.streets.find(s=>s.id===sId);
    bb.innerHTML=`<option value="">المنزل</option>${(street?.buildings||[]).map(b=>`<option value="${b.id}">${escHtml(b.name)}</option>`).join("")}`;
  };
};

window._doMove = (fromA,fromS,fromB,fId) => {
  const toA=parseInt(document.getElementById("mv_a")?.value);
  const toS=parseInt(document.getElementById("mv_s")?.value);
  const toB=parseInt(document.getElementById("mv_b")?.value);
  if(!toA||!toS||!toB){alert("اختر المنطقة والشارع والمنزل");return;}
  _moveFamily(fromA,fromS,fromB,fId,toA,toS,toB);
};

window.getFormData = (modalId) => {
  const data={};
  document.querySelectorAll(`#${modalId} [data-key]`).forEach(el=>{data[el.dataset.key]=el.value;});
  return data;
};

function _renderResults(){
  const box=document.getElementById("srchResults");
  if(!box||!state.data){ _renderContent(); return; }
  const tmp=document.createElement("div");
  tmp.innerHTML=getPageHTML();
  const nb=tmp.querySelector("#srchResults");
  if(nb) box.innerHTML=nb.innerHTML; else _renderContent();
}

function _renderContent(){
  const el = document.getElementById("pageContent");
  if(!el||!state.data) return;
  el.innerHTML = getPageHTML();
}

function getPageHTML(){
  const path=state.path;
  const area=path[0]?state.data.areas.find(a=>a.id===path[0].id):null;
  const street=path[1]?area?.streets.find(s=>s.id===path[1].id):null;
  const building=path[2]?street?.buildings.find(b=>b.id===path[2].id):null;

  if(path.length===0) return renderHome();
  if(path.length===1&&area) return renderArea(area);
  if(path.length===2&&area&&street) return renderStreet(area,street);
  if(path.length===3&&area&&street&&building) return renderBuilding(area,street,building);
  return "";
}

function renderHome(){
  const q=normAr(state.localSearch);
  const res=q.length>=2?searchAll(state.data.areas,q):[];
  const areas=state.data.areas;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <span style="color:#B8962E;font-size:15px">المناطق</span>
      <button style="${C.btn}" onclick="_setModal({type:'addArea'})">+ منطقة</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="search-input" id="srch" placeholder="🔍 بحث شامل في كل المناطق..." value="${escHtml(state.localSearch)}" oninput="_setSearch(this.value)" onkeydown="if(event.key==='Enter')this.blur()" enterkeyhint="search" autocomplete="off" style="flex:1">
      <button style="${C.btn}" onclick="_setSearch(document.getElementById('srch').value)">بحث</button>
      <button id="srchClear" style="background:#C0392B;color:#fff;border:none;border-radius:5px;padding:6px 12px;cursor:pointer;display:${state.localSearch?'inline-block':'none'}" onclick="_clearSearch()">✕ إلغاء</button>
    </div>
    <div id="srchResults">
    ${state.localSearch?(q.length<2?'<div style="text-align:center;color:#A89060;font-size:12px;margin-top:20px">اكتب حرفين على الأقل</div>':res.length>0?`
    <div style="margin-bottom:16px">
      <div style="color:#B8962E;font-size:13px;margin-bottom:8px">نتائج البحث (${res.length})${res.length>100?" — عرض أول 100":""}</div>
      ${res.slice(0,100).map(r=>resultCardHTML(r,resultClick(r),true)).join("")}
    </div>`:'<div style="text-align:center;color:#A89060;margin-top:30px;font-size:13px">لا توجد نتائج</div>'):`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">
      ${areas.map(area=>`
        <div style="${C.card}">
          <div onclick="_goTo('area',${area.id})" style="cursor:pointer">
            <div style="font-size:11px;color:#A89060;margin-bottom:4px">${area.code}</div>
            <div style="font-size:13px;font-weight:bold;margin-bottom:6px">${escHtml(area.name)}</div>
            <div style="font-size:11px;color:#A89060">${area.streets.length} شارع</div>
            <div style="font-size:11px;color:#A89060">إجمالي ${areaFamCount(area)} أسرة</div>
          </div>
          <div style="display:flex;gap:4px;justify-content:center;margin-top:8px">
            <button style="${C.btnSm}" onclick="event.stopPropagation();_setModal({type:'editArea',areaId:${area.id},name:'${escHtml(area.name)}'})">تعديل</button>
            <button style="${C.btnDanger}" onclick="event.stopPropagation();_deleteArea(${area.id})">حذف</button>
          </div>
        </div>`).join("")}
      <div style="background:transparent;border:1.5px dashed #4A3510;border-radius:10px;padding:12px;cursor:pointer;text-align:center;color:#A89060;font-size:22px" onclick="_setModal({type:'addArea'})">+</div>
    </div>`}
    </div>
  `;
}
function renderArea(area){
  const q=normAr(state.localSearch);
  const areaResults=q.length>=2?searchAll([area],q).filter(r=>r.kind!=="area"):[];
  const streets=q?area.streets.filter(s=>normAr(s.name).includes(q)):area.streets;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <span style="color:#B8962E;font-size:15px">${escHtml(area.name)} <span style="font-size:11px;color:#A89060">(${area.code})</span> <span style="font-size:12px;color:#A89060">· إجمالي ${areaFamCount(area)} أسرة</span></span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button style="${C.btnOutline}" onclick="_setModal({type:'editArea',areaId:${area.id},name:'${escHtml(area.name)}'})">تعديل</button>
        <button style="${C.btn}" onclick="_setModal({type:'addStreet',areaId:${area.id}})">+ شارع</button>
        <button style="${C.btnDanger}" onclick="_deleteArea(${area.id})">حذف</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="search-input" id="srch" placeholder="🔍 بحث باسم أو كود أو وظيفة..." value="${escHtml(state.localSearch)}" oninput="_setSearch(this.value)" onkeydown="if(event.key==='Enter')this.blur()" enterkeyhint="search" autocomplete="off" style="flex:1">
      <button style="${C.btn}" onclick="_setSearch(document.getElementById('srch').value)">بحث</button>
      
    </div>
    <div id="srchResults">${areaResults.length>0?`
    <div style="margin-bottom:16px">
      <div style="color:#B8962E;font-size:13px;margin-bottom:8px">نتائج البحث (${areaResults.length})</div>
      ${areaResults.slice(0,100).map(r=>resultCardHTML(r,resultClick(r),false)).join("")}
      ${areaResults.length>100?'<div style="text-align:center;color:#A89060;font-size:12px;margin:8px 0">عرض أول 100 نتيجة — اكتب كلمة أدق</div>':""}
    </div>`:`
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">
      ${streets.map(street=>`
        <div style="${C.card}">
          <div onclick="_goTo('street',${street.id})" style="cursor:pointer">
            <div style="font-size:13px;font-weight:bold;margin-bottom:6px">${escHtml(street.name)}</div>
            <div style="font-size:11px;color:#A89060">${street.buildings.length} منزل</div>
          </div>
          <div style="display:flex;gap:4px;justify-content:center;margin-top:8px">
            <button style="${C.btnSm}" onclick="event.stopPropagation();_setModal({type:'editStreet',areaId:${area.id},streetId:${street.id},name:'${escHtml(street.name)}'})">تعديل</button>
            <button style="${C.btnDanger}" onclick="event.stopPropagation();_deleteStreet(${area.id},${street.id})">حذف</button>
          </div>
        </div>`).join("")}
      <div style="background:transparent;border:1.5px dashed #4A3510;border-radius:10px;padding:12px;cursor:pointer;text-align:center;color:#A89060;font-size:22px" onclick="_setModal({type:'addStreet',areaId:${area.id}})">+</div>
    </div>`}</div>`;
}

function renderStreet(area,street){
  const q=normAr(state.localSearch);
  const buildings=q?street.buildings.filter(b=>normAr(b.name).includes(q)||b.families.some(f=>famMatches(f,q))):street.buildings;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <span style="color:#B8962E;font-size:15px">${escHtml(street.name)}</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button style="${C.btnOutline}" onclick="_setModal({type:'editStreet',areaId:${area.id},streetId:${street.id},name:'${escHtml(street.name)}'})">تعديل</button>
        <button style="${C.btn}" onclick="_setModal({type:'addBuilding',areaId:${area.id},streetId:${street.id}})">+ منزل</button>
        <button style="${C.btnDanger}" onclick="_deleteStreet(${area.id},${street.id})">حذف</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="search-input" id="srch" placeholder="🔍 بحث في المنازل..." value="${escHtml(state.localSearch)}" oninput="_setSearch(this.value)" onkeydown="if(event.key==='Enter')this.blur()" enterkeyhint="search" autocomplete="off" style="flex:1">
      <button style="${C.btn}" onclick="_setSearch(document.getElementById('srch').value)">بحث</button>
      
    </div>
    <div id="srchResults"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">
      ${buildings.map(b=>`
        <div style="${C.card}">
          <div onclick="_goTo('building',${b.id})" style="cursor:pointer">
            <div style="font-size:13px;font-weight:bold;margin-bottom:6px">${escHtml(b.name)}</div>
            <div style="font-size:11px;color:#A89060">${b.families.length} أسرة</div>
          </div>
          <div style="display:flex;gap:4px;justify-content:center;margin-top:8px">
            <button style="${C.btnSm}" onclick="event.stopPropagation();_setModal({type:'editBuilding',areaId:${area.id},streetId:${street.id},buildingId:${b.id},name:'${escHtml(b.name)}'})">تعديل</button>
            <button style="${C.btnDanger}" onclick="event.stopPropagation();_deleteBuilding(${area.id},${street.id},${b.id})">حذف</button>
          </div>
        </div>`).join("")}
      <div style="background:transparent;border:1.5px dashed #4A3510;border-radius:10px;padding:12px;cursor:pointer;text-align:center;color:#A89060;font-size:22px" onclick="_setModal({type:'addBuilding',areaId:${area.id},streetId:${street.id}})">+</div>
    </div></div>`;
}

function renderBuilding(area,street,building){
  const q=normAr(state.localSearch);
  const families=q?building.families.filter(f=>famMatches(f,q)):building.families;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <span style="color:#B8962E;font-size:15px">${escHtml(building.name)} <span style="font-size:12px;color:#A89060">· إجمالي ${building.families.length} أسرة</span></span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button style="${C.btnOutline}" onclick="_setModal({type:'editBuilding',areaId:${area.id},streetId:${street.id},buildingId:${building.id},name:'${escHtml(building.name)}'})">تعديل</button>
        <button style="${C.btn}" onclick="_setModal({type:'addFamily',areaId:${area.id},streetId:${street.id},buildingId:${building.id}})">+ أسرة</button>
        <button style="${C.btnDanger}" onclick="_deleteBuilding(${area.id},${street.id},${building.id})">حذف</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="search-input" id="srch" placeholder="🔍 بحث في الأسر..." value="${escHtml(state.localSearch)}" oninput="_setSearch(this.value)" onkeydown="if(event.key==='Enter')this.blur()" enterkeyhint="search" autocomplete="off" style="flex:1">
      <button style="${C.btn}" onclick="_setSearch(document.getElementById('srch').value)">بحث</button>
      
    </div>
    <div id="srchResults">${families.length===0?'<div style="text-align:center;color:#A89060;margin-top:30px;font-size:13px">لا توجد نتائج</div>':""}
    ${families.map(fam=>`
      <div style="${C.famCard}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="cursor:pointer;flex:1" onclick="_openFamily(${area.id},${street.id},${building.id},${fam.id})">
            <div style="font-size:11px;color:#B8962E;margin-bottom:3px">كود: ${fam.code}</div>
            <div style="font-size:14px;font-weight:bold;margin-bottom:3px">${escHtml(fam.husbandName||"")}${fam.wifeName?" & "+escHtml(fam.wifeName):""}</div>
            <div style="font-size:11px;color:#A89060">${escHtml(fam.husbandPhone||"")}</div>
            ${kidHit(fam,q)}
          </div>
          <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
            <span style="${C.tag}">${famMembers(fam)} فرد</span>
            <span style="${C.tag}">${(fam.children||[]).length} أبناء</span>
            <button style="${C.btnSm}" onclick="_setModal({type:'editFamily',areaId:${area.id},streetId:${street.id},buildingId:${building.id},famId:${fam.id}})">تعديل</button>
            <button style="${C.btnDanger}" onclick="_deleteFamily(${area.id},${street.id},${building.id},${fam.id})">حذف</button>
          </div>
        </div>
      </div>`).join("")}</div>`;
}

function render(){
  state.pendingRender=false;
  if(!state.data){
    document.getElementById("root").innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px"><div style="font-size:30px;color:#B8962E">✞</div><div style="color:#B8962E;font-size:16px">جاري التحميل...</div></div>`;
    return;
  }
  const path=state.path;
  const area=path[0]?state.data.areas.find(a=>a.id===path[0].id):null;
  const street=path[1]?area?.streets.find(s=>s.id===path[1].id):null;
  const building=path[2]?street?.buildings.find(b=>b.id===path[2].id):null;

  document.getElementById("root").innerHTML=`
    <div style="background:linear-gradient(135deg,#0D0800,#2C1F0A);border-bottom:2px solid #B8962E;padding:14px 24px;text-align:center">
      <div style="font-size:20px;color:#B8962E;margin-bottom:4px">✞</div>
      <div style="font-size:12px;color:#A89060;margin-bottom:2px">مطرانية الأقباط الأرثوذكس بطهطا وجهينة</div>
      <div style="font-size:18px;color:#B8962E;font-weight:bold;margin-bottom:2px">برنامج متابعة الأسر</div>
      <div style="font-size:12px;color:#A89060">كنيسة الأنبا شنودة رئيس المتوحدين</div>
    </div>
    <div id="syncbar" style="background:#0D1F0D;border-bottom:1px solid #1A3A1A;padding:6px 16px;font-size:11px;text-align:center;color:${state.syncing?"#F0A500":"#4CAF50"}">
      ${state.syncing?"⏳ جاري الحفظ...":"✅ محفوظ ومتزامن · "+(state.lastSync?.toLocaleTimeString("ar-EG")||"")}
    </div>
    <div style="background:#110D04;border-bottom:1px solid #4A3510;padding:10px 16px">
      <div style="display:flex;gap:8px">
        <input class="search-input" id="gsrch" placeholder="🔍 بحث شامل في كل البرنامج..." value="${escHtml(state.globalSearch)}" oninput="_doGlobalSearch(this.value)" onkeydown="if(event.key==='Enter')this.blur()" enterkeyhint="search" autocomplete="off" style="flex:1">
        <button style="${C.btn}" onclick="_doGlobalSearch(document.getElementById('gsrch').value)">بحث</button>
        <button id="gclear" style="background:#C0392B;color:#fff;border:none;border-radius:5px;padding:6px 10px;cursor:pointer;display:${state.globalSearch?'inline-block':'none'}" onclick="_clearGlobal()">✕</button>
      </div>
      <div id="gResults">${globalResultsHTML()}</div>
    </div>
    ${path.length>0?`
    <div style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:#110D04;border-bottom:1px solid #4A3510">
      <button style="background:#2C1F0A;border:1px solid #4A3510;color:#D4AF5A;cursor:pointer;font-size:13px;padding:5px 14px;border-radius:6px" onclick="_goBack()">← رجوع</button>
      <button style="background:none;border:none;color:#A89060;cursor:pointer;font-size:16px" onclick="_goHome()">🏠</button>
      <span style="color:#A89060;font-size:12px">${area?escHtml(area.name):""} ${street?"› "+escHtml(street.name):""} ${building?"› "+escHtml(building.name):""}</span>
    </div>`:""}
    <div style="padding:16px;max-width:900px;margin:0 auto" id="pageContent">
      ${getPageHTML()}
    </div>
    ${renderFamilyDetail()}
    ${renderModal()}
  `;
}
</script>
</body>
